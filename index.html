<title>Game Town Square — Coming Soon</title>

<style>
:root{--table:#2B211B;--gold:#F2B61D;--chalk:#F2EEE9;--dim:#BDB3A8;
  --ui:'Barlow',system-ui,-apple-system,"Segoe UI",Roboto,Arial,sans-serif;
  --display:'Saira Extra Condensed','Arial Narrow',Impact,sans-serif;
  padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
*{box-sizing:border-box}
html,body{margin:0;height:100%}
body{display:flex;align-items:center;justify-content:center;padding:24px;text-align:center;
  font:400 17px/1.5 var(--ui);color:var(--chalk);
  background:var(--table) repeating-linear-gradient(94deg,rgba(255,255,255,.018) 0 2px,transparent 2px 9px)}
.wrap{max-width:520px}
svg{width:112px;height:112px}
h1{margin:18px 0 6px;font:800 clamp(42px,12vw,72px)/1 var(--display);text-transform:uppercase;letter-spacing:1px}
.tag{margin:0 0 26px;color:var(--gold);font-weight:700;letter-spacing:2px;text-transform:uppercase;font-size:14px}
.card{background:rgba(255,255,255,.06);box-shadow:inset 0 0 0 1px rgba(255,255,255,.12);border-radius:10px;padding:20px}
.card h2{margin:0 0 8px;font:700 22px/1.2 var(--ui)}
.card p{margin:0;color:var(--dim)}
.foot{margin-top:22px;font-size:14px;color:var(--dim)}
