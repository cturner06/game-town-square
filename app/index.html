async function newVote(c) {
  const weeks = must(await sb.from("weeks").select("league,season,created_at").eq("community_id", c.id).order("created_at", { ascending: false }).limit(1));
  const own = weeks[0]?.league && ESPN_LEAGUES.includes(weeks[0].league) ? weeks[0].league : "";
  const any = S.me?.is_owner || isSuper() || !own || !!must(await sb.rpc("community_unlimited", { cid: c.id }));
  let league = own;
  if (any) {
    const v = await modal({ title: "New vote", text: "Pick the sport players will vote on.",
      fields: [{ name: "league", label: "Sport", value: own || "College Football", options: ESPN_LEAGUES.map(x => ({ value: x, label: x })) }], ok: "Next" });
    if (!v) return;
    league = v.league;
  }
  const L = leagueFor(league);
  const today = new Date(Date.now() - new Date().getTimezoneOffset() * 60000).toISOString().slice(0, 10);
  let suggested = "";
  if (L.mode === "week") try {
    const { data } = await sb.functions.invoke("pull-scores", { body: { week_on: { league, season: currentSeason(), date: today } } });
    suggested = data?.label || "";
  } catch { /* they can pick */ }
  if (L.mode === "week") setList("vote-weeks", L.weeks);
  const v = await modal({ title: `New ${league} vote`,
    text: league === "College Football" ? "Every game with at least one Top 25 team goes on the ballot. Anyone with the link can pick up to 3." : "Every game goes on the ballot. Anyone with the link can pick up to 3.",
    fields: [
      L.mode === "week"
        ? { name: "label", label: "Week", value: suggested, list: "vote-weeks", placeholder: "Pick a week", half: true }
        : { name: "date", label: "Game date", type: "date", value: today, half: true },
      { name: "season", label: "Season", type: "number", value: currentSeason(), half: true },
      { name: "closes", label: "Voting closes (blank: first kickoff)", type: "datetime-local", value: "" }
    ], ok: "Create vote" });
  if (!v) return;
  const label = L.mode === "week" ? (L.weeks.find(x => x.toLowerCase() === String(v.label).trim().toLowerCase()) || "") : dateParts(v.date).label;
  if (L.mode === "week" && !label) return toast("Pick a week from the list.", true);
  const season = L.mode === "week" ? (Number(v.season) || currentSeason()) : (L.crossYear && dateParts(v.date).m < 8 ? dateParts(v.date).y - 1 : dateParts(v.date).y);
  try {
    const { data, error } = await sb.functions.invoke("pull-scores", { body: { poll_games: { league, season, label, date: L.mode === "date" ? String(dateParts(v.date).key) : "" } } });
    if (error) throw new Error("Couldn't reach ESPN. Try again in a minute.");
    const games = data?.games || [];
    if (!games.length) return toast(`No ${league === "College Football" ? "Top 25 " : ""}games found for ${label}.`, true);
    // Closes at the chosen time, or the first kickoff (a game with no time yet counts as 11 AM Eastern)
    const kick = g => tbaTime(g.kickoff) ? Date.parse(etDate(g.kickoff) + "T15:00:00Z") : Date.parse(g.kickoff);
    const closes = v.closes ? new Date(v.closes).toISOString() : new Date(Math.min(...games.map(kick))).toISOString();
    const row = must(await sb.from("polls").insert({ community_id: c.id, league, season, label, games, closes_at: closes }).select().single());
    go("#/v/" + row.id);
  } catch (e) { toast(e.message, true); }
}

// Turn a voted game into a board: finds or creates its week and game day, then opens Add board with the teams filled in
async function boardFromVote(p, g) {
  try {
    const L = leagueFor(p.league), day = etDate(g.kickoff);
    let label = p.label, season = p.season, sortKey;
    if (L.mode === "week") sortKey = L.weeks.indexOf(label) + 1;
    else { const d = dateParts(day); label = d.label; sortKey = d.key; season = L.crossYear && d.m < 8 ? d.y - 1 : d.y; }
    let w = must(await sb.from("weeks").select("*").eq("community_id", p.community_id).eq("league", p.league).eq("season", season).eq("label", label).maybeSingle());
    if (!w) w = must(await sb.from("weeks").insert({ community_id: p.community_id, league: p.league, season, label, sort_key: sortKey }).select().single());
    let set = must(await sb.from("board_sets").select("id,name,game_date,community_id,week_id,boards(id)").eq("week_id", w.id).eq("game_date", day).maybeSingle());
    if (!set) set = { ...must(await sb.from("board_sets").insert({ community_id: p.community_id, week_id: w.id, name: gameDayName(day), game_date: day }).select().single()), boards: [] };
    const kickLine = tbaTime(g.kickoff) ? (g.tv ? `On ${g.tv}` : "") :
      `${new Date(g.kickoff).toLocaleTimeString("en-US", { hour: "numeric", minute: "2-digit", timeZone: TZ }).replace(":00", "")} kickoff${g.tv ? " on " + g.tv : ""}`;
    await addBoard({ ...set, weeks: w }, (set.boards || []).length,
      { top_team: g.top, side_team: g.side, top_color: g.top_color || undefined, side_color: g.side_color || undefined, kickoff: kickLine },
      async row => {
        const games = p.games.map(x => x.id === g.id ? { ...x, board_id: row.id } : x);
        try { must(await sb.from("polls").update({ games }).eq("id", p.id)); } catch { /* the board is made either way */ }
        go("#/b/" + row.id);
      });
  } catch (e) { toast(e.message, true); }
}

// Photo upload: cropped to a square and shrunk to 256 x 256 before it leaves the phone
async function uploadPhoto(file, forSquare = false) {
  try {
    const img = await createImageBitmap(file);
    const side = Math.min(img.width, img.height), cv = document.createElement("canvas");
    cv.width = cv.height = 256;
    cv.getContext("2d").drawImage(img, (img.width - side) / 2, (img.height - side) / 2, side, side, 0, 0, 256, 256);
    const blob = await new Promise(r => cv.toBlob(r, "image/jpeg", 0.85));
    const path = forSquare ? `${S.me.id}/${Date.now()}.jpg` : S.me.id + ".jpg";
    const { error } = await sb.storage.from("avatars").upload(path, blob, { upsert: true, contentType: "image/jpeg", cacheControl: "3600" });
    if (error) throw error;
    const url = sb.storage.from("avatars").getPublicUrl(path).data.publicUrl + (forSquare ? "" : "?v=" + Date.now());
    if (forSquare) { toast("Photo added. Tap Save to keep it."); return url; }
    must(await sb.from("profiles").update({ avatar_url: url }).eq("id", S.me.id));
    await loadMe(); toast("Photo saved");
  } catch (e) { toast(e.message || "That photo didn't upload. Try a JPG or PNG.", true); }
}

function poolState(p) {
  if (!p.loaded_at) return { open: false, locked: false, text: "Waiting for the bracket" };
  const lock = Date.parse(p.picks_lock_at || "");
  if (Number.isFinite(lock) && lock <= Date.now()) return { open: false, locked: true, text: "Picks locked" };
  return { open: true, locked: false, text: `Picks open until ${lockTime(p.picks_lock_at)}` };
}

          h("div", { class: "playout" }, gamesEl, leaderEl),
          canPick && h("div", { class: "savebar" }, countEl,
            h("label", {}, tbLocked ? "Tiebreaker (locked)" : "Last bowl total points", tbInput),
            btn("Save picks", save, "primary")),
          h("h2", {}, started ? "Standings" : "Players"),
          standingsEl,
          h("p", { class: "meta" }, lastGame ? `Ties go to the closest guess of total points in the last bowl (${lastGame.name}).` : "")
        ]
      : [h("p", { class: "empty" }, "The bowls aren't loaded yet. Picks open once the bowl schedule is announced and loaded from ESPN."),
         h("h2", {}, "Players"), standingsEl]
  );
  document.querySelector("main")?.classList.add("wide");
}

/* ---------- Start ---------- */
(async () => {
  if (CONFIGURED) {
    try { await loadMe(); } catch (e) { console.error(e); }
    sb.auth.onAuthStateChange(ev => {
      if (ev === "SIGNED_OUT") setTimeout(async () => { await loadMe(); route(); }, 0);
    });
  }
  route();
  if (/type=recovery/.test(location.hash) || /type=recovery/.test(location.search)) handleRecovery();
})();
</script>
</body>
</html>
