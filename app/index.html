<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Game Town Square</title>
<link rel="icon" href="brand/favicon.svg" type="image/svg+xml">
<link rel="icon" href="brand/favicon.ico" sizes="any">
<link rel="apple-touch-icon" href="brand/apple-touch-icon.png">
<meta name="theme-color" content="#2B211B">
<link rel="manifest" href="manifest.webmanifest">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Game Town">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Barlow:wght@400;600;700&family=Kalam:wght@400;700&family=Saira+Extra+Condensed:wght@800&display=swap" rel="stylesheet">
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.116.0/dist/umd/supabase.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/html2canvas/1.4.1/html2canvas.min.js"></script>
<style>
:root{
  --table:#2B211B; --table-2:#33271F; --chalk:#F2EEE9; --chalk-dim:#BDB3A8;
  --paper:#FFFFFF; --ink:#1D1D1D; --rule:#3A3A3A; --muted:#6B6B6B;
  --marker:#1F4FD1; --danger:#B3261E; --ok:#2E7D32;
  --hand:'Kalam',cursive; --ui:'Barlow',system-ui,sans-serif; --display:'Saira Extra Condensed','Arial Narrow',sans-serif;
}
*{box-sizing:border-box}
:root{padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
html,body{margin:0}
body{
  font:400 16px/1.45 var(--ui); color:var(--chalk); min-height:100vh;
  background:var(--table) repeating-linear-gradient(94deg,rgba(255,255,255,.018) 0 2px,transparent 2px 9px);
}
a{color:inherit}
button,input{font:inherit}
:focus-visible{outline:3px solid #7FA6FF;outline-offset:2px}

/* ---------- App chrome ---------- */
.top{display:flex;align-items:center;justify-content:space-between;gap:12px;padding:12px 16px;border-bottom:1px solid rgba(255,255,255,.1)}
.brand{display:flex;align-items:center;gap:8px;font:800 26px/1 var(--display);letter-spacing:.5px;text-decoration:none;color:var(--chalk);white-space:nowrap}
.brand .mark{flex-shrink:0}
.who{display:flex;align-items:center;gap:10px;font-size:14px;color:var(--chalk-dim);min-width:0}
.who span{overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.whoname{background:none;border:0;color:inherit;font:inherit;padding:4px 0;cursor:pointer;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;min-width:0;text-decoration:underline dotted;text-underline-offset:3px}
.sheettop{display:flex;justify-content:space-between;gap:12px;font:700 15px/1.2 var(--ui);color:#444;margin-bottom:-18px}
.lockstamp{margin-left:auto;font-size:14px;font-weight:700;color:var(--chalk-dim);white-space:nowrap}
.who .btn{white-space:nowrap;flex-shrink:0}
.wrap{max-width:1040px;margin:0 auto;padding:18px 16px 60px}
h1{font:800 42px/1 var(--display);margin:6px 0 4px;letter-spacing:.3px}
h2{font:700 20px/1.2 var(--ui);margin:28px 0 10px}
.sub{color:var(--chalk-dim);margin:0 0 14px}
.crumbs{font-size:14px;color:var(--chalk-dim)}
.crumbs a{color:var(--chalk-dim)}
.actions{display:flex;flex-wrap:wrap;gap:8px;margin:12px 0}
/* Frosted glass buttons over the dark background */
.btn{min-height:42px;padding:9px 16px;border:0;border-radius:10px;font-weight:600;cursor:pointer;
  color:var(--chalk);background:rgba(255,255,255,.12);
  -webkit-backdrop-filter:blur(14px) saturate(160%);backdrop-filter:blur(14px) saturate(160%);
  box-shadow:inset 0 1px 0 rgba(255,255,255,.35), inset 0 0 0 1px rgba(255,255,255,.18), 0 2px 10px rgba(0,0,0,.28);
  transition:background .15s ease, transform .1s ease}
.btn:hover{background:rgba(255,255,255,.2)}
.btn:active{transform:translateY(1px)}
.btn.primary{background:rgba(88,132,255,.38);box-shadow:inset 0 1px 0 rgba(255,255,255,.45), inset 0 0 0 1px rgba(150,180,255,.5), 0 2px 12px rgba(31,79,209,.35)}
.btn.primary:hover{background:rgba(88,132,255,.5)}
.btn.danger{color:#FFC9C4;background:rgba(220,70,60,.22);box-shadow:inset 0 1px 0 rgba(255,255,255,.25), inset 0 0 0 1px rgba(255,120,110,.4), 0 2px 10px rgba(0,0,0,.28)}
.btn.danger:hover{background:rgba(220,70,60,.34)}
.btn.ghost{background:rgba(255,255,255,.06)}
.btn:disabled{opacity:.45;cursor:default}
/* On the white panels and dialogs, the glass goes light */
.panel .btn,.modal .btn{color:var(--ink);background:rgba(20,20,20,.06);
  box-shadow:inset 0 1px 0 rgba(255,255,255,.7), inset 0 0 0 1px rgba(0,0,0,.14), 0 1px 6px rgba(0,0,0,.1)}
.panel .btn:hover,.modal .btn:hover{background:rgba(20,20,20,.11)}
.panel .btn.primary,.modal .btn.primary{color:#fff;background:rgba(31,79,209,.9);
  box-shadow:inset 0 1px 0 rgba(255,255,255,.35), 0 2px 10px rgba(31,79,209,.35)}
.panel .btn.danger,.modal .btn.danger{color:#8C1D18;background:rgba(179,38,30,.12);
  box-shadow:inset 0 1px 0 rgba(255,255,255,.6), inset 0 0 0 1px rgba(179,38,30,.35)}
.list{list-style:none;margin:0;padding:0;display:grid;gap:8px}
.list li{display:flex;align-items:center;justify-content:space-between;gap:10px;padding:12px 14px;border-radius:10px;background:rgba(255,255,255,.07);-webkit-backdrop-filter:blur(10px);backdrop-filter:blur(10px);box-shadow:inset 0 1px 0 rgba(255,255,255,.18), inset 0 0 0 1px rgba(255,255,255,.1)}
.list a{font-weight:600;text-decoration:none}
.search{width:100%;min-height:44px;padding:10px 12px;margin:6px 0 14px;border-radius:8px;border:0;box-shadow:inset 0 0 0 1px rgba(255,255,255,.25);background:rgba(255,255,255,.06);color:var(--chalk);font-size:16px}
.people{display:grid;gap:10px}
.person{padding:14px;border-radius:12px;background:rgba(255,255,255,.07);-webkit-backdrop-filter:blur(10px);backdrop-filter:blur(10px);box-shadow:inset 0 1px 0 rgba(255,255,255,.18), inset 0 0 0 1px rgba(255,255,255,.1)}
.phead{display:flex;flex-wrap:wrap;justify-content:space-between;gap:8px;margin-bottom:8px}
.tags{display:flex;flex-wrap:wrap;gap:6px}
.tag{font-size:12px;font-weight:700;padding:3px 8px;border-radius:999px;background:var(--gold-tag,#F2B61D);color:#1D1D1D}
.check{display:flex;align-items:center;gap:8px;min-height:36px;font-weight:600}
.check input{width:20px;height:20px;accent-color:var(--marker)}
.commlist{margin:6px 0 4px;padding-left:2px}
.person .actions{margin:10px 0 0}
.list a:hover{text-decoration:underline}
.meta{font-size:14px;color:var(--chalk-dim)}
.empty{color:var(--chalk-dim);padding:18px 0}
.err{color:#FFB4AB}
.panel{max-width:380px;margin:40px auto;padding:22px;border-radius:10px;background:var(--paper);color:var(--ink)}
.panel h1{color:var(--ink)}
.panel p{color:var(--muted)}

/* ---------- Board block ---------- */
.block{margin:26px 0 34px}
.bar{display:flex;flex-wrap:wrap;align-items:center;gap:8px;margin-bottom:10px}
.status{font-size:14px;font-weight:700;padding:7px 12px;border-radius:999px;margin-right:4px;-webkit-backdrop-filter:blur(10px);backdrop-filter:blur(10px);box-shadow:inset 0 0 0 1px rgba(255,255,255,.15)}
.status.open{background:rgba(46,125,50,.25);color:#B9E6BC}
.status.locked{background:rgba(179,38,30,.3);color:#FFC9C4}
.fit{position:relative;width:100%;overflow:hidden}

/* ---------- The sheet (this is what gets exported) ---------- */
.sheet{position:absolute;top:0;left:0;width:980px;background:var(--paper);color:var(--ink);padding:14px 22px 16px;transform-origin:top left;box-shadow:0 10px 30px rgba(0,0,0,.45)}
.kick{text-align:center;font:700 26px/1.2 var(--hand);min-height:30px}
.shead{display:flex;justify-content:space-between;align-items:flex-start;gap:16px}
.title{font:800 78px/.92 var(--display);text-transform:uppercase;letter-spacing:1px;color:#3B3B3B;white-space:nowrap;overflow:hidden;min-width:0}
.price{font:700 18px var(--ui);color:#7A7A7A;padding-top:6px;white-space:nowrap}
.smain{display:flex;gap:14px;margin-top:10px}
.grid{flex:1;display:grid;grid-template-columns:46px 44px repeat(10,minmax(0,1fr));grid-template-rows:48px 44px repeat(10,58px);border-top:2px solid var(--rule);border-left:2px solid var(--rule)}
.grid>div{border-right:1px solid var(--rule);border-bottom:1px solid var(--rule);min-width:0}
.grid>div.c10{border-right-width:2px}
.grid>div.r10{border-bottom-width:2px}
.corner{grid-column:1/3;grid-row:1/3}
.tlabel{grid-column:3/13;grid-row:1;display:flex;align-items:center;justify-content:center;padding:0 10px;border-right-width:2px !important;overflow:hidden}
.team{font:800 40px/1 var(--display);text-transform:uppercase;letter-spacing:1px;white-space:nowrap}
.slabel{grid-column:1;grid-row:3/13;position:relative;overflow:hidden;border-bottom-width:2px !important}
.slabel>div{position:absolute;left:50%;top:50%;width:580px;transform:translate(-50%,-50%) rotate(-90deg);display:flex;align-items:center;justify-content:center;white-space:nowrap}
.num{display:flex;align-items:center;justify-content:center;font:800 30px/1 var(--display)}
.sq{position:relative;display:flex;align-items:center;justify-content:center;padding:11px 3px}
.sq .nm{display:block;width:100%;text-align:center;font:400 15px/1.05 var(--hand);max-height:32px;overflow:hidden;overflow-wrap:anywhere}
.sq .no{position:absolute;right:3px;bottom:1px;font:600 10px/1 var(--ui);color:#555}
.sq.win{background:#FFE58A}
.sq .wb{position:absolute;left:2px;top:2px;font:700 9px/1 var(--ui);background:#1D1D1D;color:#FFE14D;padding:2px 3px;border-radius:3px;white-space:nowrap}
.gstat{text-align:center;font:700 15px/1.3 var(--ui);color:#444;margin-top:2px}
.gstat.on{color:#B3261E}
.pay>div.won{background:#FFF4CC}
.pay .sc{font:600 11px/1.2 var(--ui);color:#666;text-align:center;margin-top:2px}
.pay .who{display:block;width:100%;margin:auto 0 2px;font:700 24px/1.05 var(--hand);color:#1D1D1D;text-align:center;overflow-wrap:anywhere}
.pay .who.none{font:600 13px/1.2 var(--ui);color:#666}
.pay .amt{font:700 16px/1.2 var(--ui);color:#444;text-align:center}
.status.live{background:rgba(179,38,30,.9);color:#fff}
.edit .sq,.edit .num{cursor:pointer}
.edit .sq:hover{background:#EEF3FF}
.edit .num:hover{filter:brightness(.92)}
.pay{width:130px;display:flex;flex-direction:column;gap:10px;border:2px solid var(--rule);padding:10px}
.pay>div{flex:1;border:2px solid var(--rule);padding:8px;display:flex;flex-direction:column}
.pay b{font:700 14px var(--ui)}
.pay span{margin:auto 0;text-align:center;font:700 20px var(--ui);color:#666}
.foot{text-align:center;font:700 34px/1.2 var(--hand);margin-top:8px;letter-spacing:1px}

/* ---------- Modal & toast ---------- */
.scrim{position:fixed;inset:0;background:rgba(0,0,0,.55);display:flex;align-items:flex-end;justify-content:center;z-index:50;padding:12px}
@media (min-width:640px){.scrim{align-items:center}}
.modal{width:100%;max-width:460px;max-height:90vh;overflow:auto;background:var(--paper);color:var(--ink);border-radius:12px;padding:18px}
.modal h3{margin:0 0 6px;font:700 20px var(--ui)}
.modal p{margin:0 0 12px;color:var(--muted)}
.mform{display:grid;grid-template-columns:1fr 1fr;gap:10px 12px}
.mform label{display:flex;flex-direction:column;gap:4px;font-size:14px;font-weight:600;color:#444;grid-column:span 2}
.mform label.half{grid-column:span 1}
.mform input,.mform select{min-height:42px;padding:8px 10px;border:1px solid #B8B8B8;border-radius:6px;font-size:16px;color:var(--ink);background:#fff;width:100%}
.mform input[type=color]{padding:3px;height:42px}
.swatches{display:flex;gap:6px}
.swatch{width:34px;height:28px;border-radius:5px;border:0;box-shadow:inset 0 0 0 1px rgba(0,0,0,.35);cursor:pointer}
.mbtns{grid-column:span 2;display:flex;flex-wrap:wrap;justify-content:flex-end;gap:8px;margin-top:6px}
.mbtns .btn{box-shadow:inset 0 0 0 1px #C9C9C9}
.mbtns .btn.primary{box-shadow:none}
.toast{position:fixed;left:50%;bottom:calc(18px + env(safe-area-inset-bottom,0px));transform:translateX(-50%);background:var(--paper);color:var(--ink);padding:10px 16px;border-radius:8px;font-weight:600;box-shadow:0 6px 20px rgba(0,0,0,.4);z-index:60;max-width:90vw}
.toast.bad{background:#FFDAD6;color:#410002}
@media (prefers-reduced-motion:no-preference){.modal{animation:up .16s ease-out}@keyframes up{from{transform:translateY(12px);opacity:0}}}
</style>
</head>
<body>
<div id="app"></div>
<script>
/* =====================================================================
   SETUP: paste your two Supabase values here (see SETUP.md, step 3).
   ===================================================================== */
const SUPABASE_URL = "https://cbtnuicbuzjzmkoyjeej.supabase.co";
const SUPABASE_ANON_KEY = "sb_publishable_zYFwDKLwpHVsyrejG5tZZw_4TOu7Mvi";   // public key, safe to publish
/* ===================================================================== */

const CONFIGURED = !SUPABASE_URL.startsWith("PASTE") && !SUPABASE_ANON_KEY.startsWith("PASTE");
const sb = CONFIGURED ? supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY) : null;
const SHEET_W = 980;
const S = { session: null, me: null, admin: new Set(), helper: new Set() };
const $app = document.getElementById("app");

/* ---------- Small helpers ---------- */
function h(tag, attrs = {}, ...kids) {
  const el = document.createElement(tag);
  for (const [k, v] of Object.entries(attrs || {})) {
    if (v === false || v == null) continue;
    if (k.startsWith("on")) el.addEventListener(k.slice(2), v);
    else if (k === "class") el.className = v;
    else if (k === "style") el.style.cssText = v;
    else el.setAttribute(k, v === true ? "" : v);
  }
  for (const kid of kids.flat(Infinity)) {
    if (kid === false || kid == null) continue;
    el.append(kid instanceof Node ? kid : document.createTextNode(String(kid)));
  }
  return el;
}
const btn = (label, fn, cls = "") => h("button", { class: "btn " + cls, type: "button", onclick: fn }, label);
const money = n => Number(n || 0).toLocaleString("en-US", { style: "currency", currency: "USD" });
// When the board was locked, in the reader's own time zone
// Every time in the app is Central, wherever the reader is
const TZ = "America/Chicago";
const lockTime = t => {
  const d = new Date(t);
  if (isNaN(d)) return "";
  const when = d.toLocaleString("en-US", { month: "short", day: "numeric", hour: "numeric", minute: "2-digit", timeZone: TZ });
  const zone = new Intl.DateTimeFormat("en-US", { timeZone: TZ, timeZoneName: "short" })
    .formatToParts(d).find(p => p.type === "timeZoneName")?.value || "CT";
  return `${when} ${zone}`;
};
const boardName = b => [b.top_team, b.side_team].filter(Boolean).join(" vs ") || "Untitled board";
const link = hash => location.origin + location.pathname + hash;
const isSuper = () => !!(S.me && S.me.is_super_admin);
const canManage = cid => !!S.me && (isSuper() || S.admin.has(cid));
function go(hash) { if (location.hash === hash) route(); else location.hash = hash; }
function textOn(hex) {
  const m = /^#?([0-9a-f]{6})$/i.exec(hex || "");
  if (!m) return "#1D1D1D";
  const n = parseInt(m[1], 16), r = n >> 16, g = (n >> 8) & 255, b = n & 255;
  return (0.299 * r + 0.587 * g + 0.114 * b) > 150 ? "#1D1D1D" : "#FFFFFF";
}
function toast(msg, bad = false) {
  document.querySelectorAll(".toast").forEach(t => t.remove());
  const t = h("div", { class: "toast" + (bad ? " bad" : ""), role: "status" }, msg);
  document.body.append(t);
  setTimeout(() => t.remove(), 3200);
}
async function copy(text) {
  try { await navigator.clipboard.writeText(text); toast("Link copied"); }
  catch { window.prompt("Copy this link:", text); }
}
function must({ data, error }) { if (error) throw new Error(error.message); return data; }

/* ---------- Modal ---------- */
function modal({ title, text, fields = [], ok = "Save", okClass = "primary", extra = [], after }) {
  return new Promise(resolve => {
    const inputs = {};
    const close = val => { scrim.remove(); document.removeEventListener("keydown", onKey); resolve(val); };
    const onKey = e => { if (e.key === "Escape") close(null); };
    const form = h("form", { class: "mform", onsubmit: e => {
      e.preventDefault();
      const vals = {};
      for (const [k, el] of Object.entries(inputs)) vals[k] = el.value;
      close(vals);
    }});
    for (const f of fields) {
      const inp = f.options
        ? h("select", { name: f.name }, f.options.map(o => h("option", { value: o.value, selected: String(o.value) === String(f.value) }, o.label)))
        : h("input", {
            type: f.type || "text", name: f.name, value: f.value ?? "", placeholder: f.placeholder,
            inputmode: f.inputmode, min: f.min, max: f.max, step: f.step, maxlength: f.maxlength,
            autocomplete: f.autocomplete || "off", required: f.required, list: f.list
          });
      inputs[f.name] = inp;
      form.append(h("label", { class: f.half ? "half" : "" }, h("span", {}, f.label), inp));
    }
    form.append(h("div", { class: "mbtns" },
      btn("Cancel", () => close(null)),
      extra.map(x => btn(x.label, () => close({ __action: x.action }), x.cls || "")),
      h("button", { class: "btn " + okClass, type: "submit" }, ok)
    ));
    const scrim = h("div", { class: "scrim", onclick: e => { if (e.target === scrim) close(null); } },
      h("div", { class: "modal", role: "dialog", "aria-modal": "true", "aria-label": title },
        h("h3", {}, title), text && h("p", {}, text), form));
    document.body.append(scrim);
    document.addEventListener("keydown", onKey);
    if (after) after(inputs);
    const first = form.querySelector("input");
    (first || form.querySelector(".btn.primary, .btn.danger"))?.focus();
    if (first && first.select) first.select();
  });
}
const confirmBox = (title, text, ok, okClass = "danger") => modal({ title, text, ok, okClass }).then(v => !!v);

/* ---------- Auth state ---------- */
async function loadMe() {
  S.session = must(await sb.auth.getSession()).session;
  S.me = null; S.admin = new Set();
  if (!S.session) return;
  const uid = S.session.user.id;
  const p = must(await sb.from("profiles").select("*").eq("id", uid).maybeSingle());
  S.me = p || { id: uid, email: S.session.user.email, is_super_admin: false };
  const ca = must(await sb.from("community_admins").select("community_id").eq("user_id", uid));
  ca.forEach(r => S.admin.add(r.community_id));
  const ba = must(await sb.from("board_admins").select("board_id").eq("user_id", uid));
  S.helper = new Set((ba || []).map(r => r.board_id));
}

/* ---------- Layout ---------- */
const MARK_SVG = '<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="30" height="30" aria-hidden="true" class="mark"><path d="M256 24 L456 86 V252 C456 378 366 452 256 492 C146 452 56 378 56 252 V86 Z" fill="#F2B61D"/><path d="M256 50 L430 104 V252 C430 362 352 428 256 464 C160 428 82 362 82 252 V104 Z" fill="#2B211B"/><path d="M256 68 L412 116 V252 C412 350 342 410 256 444 C170 410 100 350 100 252 V116 Z" fill="none" stroke="#F2EEE9" stroke-width="5"/><rect x="154.0" y="122" width="56" height="56" rx="8" fill="none" stroke="#F2EEE9" stroke-width="8"/><rect x="228.0" y="122" width="56" height="56" rx="8" fill="none" stroke="#F2EEE9" stroke-width="8"/><rect x="302.0" y="122" width="56" height="56" rx="8" fill="none" stroke="#F2EEE9" stroke-width="8"/><rect x="154.0" y="196" width="56" height="56" rx="8" fill="none" stroke="#F2EEE9" stroke-width="8"/><rect x="224.0" y="192" width="64" height="64" rx="10" fill="#F2B61D"/><polygon points="256.0,199.0 262.7,216.8 281.7,217.7 266.8,229.5 271.9,247.8 256.0,237.3 240.1,247.8 245.2,229.5 230.3,217.7 249.3,216.8" fill="#2B211B"/><rect x="302.0" y="196" width="56" height="56" rx="8" fill="none" stroke="#F2EEE9" stroke-width="8"/><rect x="154.0" y="270" width="56" height="56" rx="8" fill="none" stroke="#F2EEE9" stroke-width="8"/><rect x="228.0" y="270" width="56" height="56" rx="8" fill="none" stroke="#F2EEE9" stroke-width="8"/><rect x="302.0" y="270" width="56" height="56" rx="8" fill="none" stroke="#F2EEE9" stroke-width="8"/></svg>';
function brandLink() {
  const a = h("a", { class: "brand", href: "#/" });
  a.innerHTML = MARK_SVG;
  a.append("Game Town Square");
  return a;
}
function topbar() {
  return h("header", { class: "top" },
    brandLink(),
    h("div", { class: "who" },
      S.session
        ? [h("button", { type: "button", class: "whoname", title: "Change your name", onclick: () => editName() }, displayName(S.me) + (isSuper() ? " (super admin)" : "")), btn("Sign out", signOut, "ghost")]
        : h("a", { href: "#/login" }, "Admin sign in"))
  );
}
function render(...nodes) {
  $app.replaceChildren(topbar(), h("main", { class: "wrap" }, ...nodes));
  requestAnimationFrame(fitBoards);
}
function fitBoards() {
  document.querySelectorAll(".fit").forEach(fit => {
    const sheet = fit.firstElementChild;
    const s = Math.min(1, fit.clientWidth / SHEET_W);
    sheet.style.transform = `scale(${s})`;
    fit.style.height = Math.ceil(sheet.offsetHeight * s) + "px";
  });
}

/* ---------- Game schedule (ESPN model) ----------
   Every board works the same. Only the schedule differs by league, the way ESPN does it:
   football runs in numbered weeks; basketball, baseball, hockey and soccer run by game date. */
const range = (n, f) => Array.from({ length: n }, (_, i) => f(i + 1));
const LEAGUES = {
  "NFL": { sport: "Football", mode: "week", weeks: ["Hall of Fame Weekend", ...range(3, i => `Preseason Week ${i}`), ...range(18, i => `Week ${i}`),
    "Wild Card", "Divisional Round", "Conference Championships", "Pro Bowl", "Super Bowl"] },
  "College Football": { sport: "Football", mode: "week", weeks: [...range(16, i => `Week ${i}`), "Bowls"] },
  "NBA": { sport: "Basketball", mode: "date", crossYear: true },
  "WNBA": { sport: "Basketball", mode: "date" },
  "Men's College Basketball": { sport: "Basketball", mode: "date", crossYear: true },
  "Women's College Basketball": { sport: "Basketball", mode: "date", crossYear: true },
  "MLB": { sport: "Baseball", mode: "date" },
  "NHL": { sport: "Hockey", mode: "date", crossYear: true },
  "MLS": { sport: "Soccer", mode: "date" }
};
const SPORTS = ["Football", "Basketball", "Baseball", "Softball", "Hockey", "Soccer", "Volleyball", "Lacrosse"];
function leagueFor(name) {
  const k = Object.keys(LEAGUES).find(k => k.toLowerCase() === String(name || "").trim().toLowerCase());
  return k ? { name: k, ...LEAGUES[k] } : null;
}
// Football seasons run into January and February, so those months belong to last year's season.
function currentSeason() { const d = new Date(); return d.getMonth() < 2 ? d.getFullYear() - 1 : d.getFullYear(); }
// Winter leagues (NBA, NHL, college hoops) span two years; ESPN shows them as "2026-27".
const seasonLabel = (league, season) => leagueFor(league)?.crossYear ? `${season}-${String(season + 1).slice(-2)}` : String(season);
function dateParts(iso) {
  const [y, m, d] = iso.split("-").map(Number);
  const dt = new Date(Date.UTC(y, m - 1, d));
  return { y, m, key: y * 10000 + m * 100 + d,
    label: dt.toLocaleDateString("en-US", { weekday: "short", month: "short", day: "numeric", timeZone: "UTC" }) };
}
const weekSort = (a, b) => (b.season - a.season) || (b.sort_key - a.sort_key) || String(b.created_at).localeCompare(String(a.created_at));
function setList(id, values) {
  let dl = document.getElementById(id);
  if (!dl) { dl = h("datalist", { id }); document.body.append(dl); }
  dl.replaceChildren(...values.map(v => h("option", { value: v })));
}
const countOf = (n, word) => `${n} ${word}${n === 1 ? "" : "s"}`;

async function weekForm(title, ok, current, weeks) {
  setList("league-list", Object.keys(LEAGUES));
  const today = new Date(Date.now() - new Date().getTimezoneOffset() * 60000).toISOString().slice(0, 10);
  const curDate = current && String(current.sort_key).length === 8
    ? `${String(current.sort_key).slice(0, 4)}-${String(current.sort_key).slice(4, 6)}-${String(current.sort_key).slice(6)}` : today;
  const v = await modal({ title, ok,
    text: "Pick a league. Football leagues use weeks; other ESPN leagues use the game date. Any other league, type your own.",
    fields: [
      { name: "league", label: "League", list: "league-list", value: current?.league || "", placeholder: "NFL, NBA, MLB, or type one", required: true, maxlength: 40 },
      { name: "season", label: "Season", type: "number", inputmode: "numeric", value: current?.season ?? currentSeason(), min: 2000, max: 2100, half: true },
      { name: "label", label: "Week", list: "week-list", value: current && !String(current.sort_key).match(/^\d{8}$/) ? current.label : "", placeholder: "Week 1", maxlength: 40, half: true },
      { name: "date", label: "Game date", type: "date", value: curDate }
    ],
    after: inputs => {
      const show = (el, on) => { el.closest("label").style.display = on ? "" : "none"; };
      const sync = () => {
        const L = leagueFor(inputs.league.value), byDate = L?.mode === "date";
        setList("week-list", L?.weeks || []);
        show(inputs.season, !byDate); show(inputs.label, !byDate); show(inputs.date, byDate);
      };
      inputs.league.addEventListener("input", sync); sync();
    } });
  if (!v) return null;
  const L = leagueFor(v.league);
  const league = L ? L.name : v.league.trim();
  if (!league) { toast("Enter a league.", true); return null; }
  if (L?.mode === "date") {
    if (!v.date) { toast("Pick the game date.", true); return null; }
    const d = dateParts(v.date);
    return { league, season: L.crossYear && d.m < 8 ? d.y - 1 : d.y, label: d.label, sort_key: d.key };
  }
  const season = Number(v.season) || currentSeason();
  let label = v.label.trim();
  if (!label) { toast("Enter the week.", true); return null; }
  // Preset weeks sort in season order; typed-in weeks go after the latest one
  const idx = L ? L.weeks.findIndex(x => x.toLowerCase() === label.toLowerCase()) : -1;
  if (idx >= 0) label = L.weeks[idx];
  const same = (weeks || []).filter(w => w.league === league && w.season === season && w.id !== current?.id);
  return { league, season, label, sort_key: idx >= 0 ? idx + 1 : Math.max(0, ...same.map(w => w.sort_key)) + 1 };
}

    const uid = must(await sb.rpc("find_user_by_email", { e: v.email }));
    if (!uid) return toast("No login found for that email. Have them create one first.", true);
    const { error } = await sb.from("community_admins").insert({ community_id: cid, user_id: uid });
    if (error && error.code !== "23505") throw new Error(error.message);
    route();
  } catch (e) { toast(e.message, true); }
}

async function removeAdmin(cid, a) {
  if (!await confirmBox("Remove admin?", `${a.profiles?.email || "This person"} will lose edit access to this community.`, "Remove admin")) return;
  try { must(await sb.from("community_admins").delete().eq("community_id", cid).eq("user_id", a.user_id)); route(); }
  catch (e) { toast(e.message, true); }
}

async function deleteCommunity(c) {
  const v = await modal({ title: "Delete community?", text: `Every board set and board in "${c.name}" will be deleted. Type the community name to confirm.`,
    fields: [{ name: "name", label: "Community name" }], ok: "Delete community", okClass: "danger" });
  if (!v) return;
  if (v.name.trim() !== c.name) return toast("Name didn't match. Nothing was deleted.", true);
  try { must(await sb.from("communities").delete().eq("id", c.id)); go("#/"); }
  catch (e) { toast(e.message, true); }
}

async function viewSet(id) {
  const set = must(await sb.from("board_sets").select("id,name,community_id,week_id,communities(name),weeks(id,label,league,season,sort_key)").eq("id", id).maybeSingle());
  if (!set) throw new Error("Board set not found. Check the link.");
  const boards = must(await sb.from("boards").select("*").eq("set_id", id)
    .order("sort_order").order("created_at"));
  const mg = canManage(set.community_id);
  const wk = set.weeks || {};
  render(
    h("div", { class: "crumbs" },
      mg && [h("a", { href: "#/c/" + set.community_id }, set.communities?.name || "Community"), " › "],
      h("a", { href: "#/w/" + set.week_id }, wk.label || "Game week")),
    h("h1", {}, set.name),
    h("p", { class: "sub" }, wk.league ? `${wk.label}, ${wk.league} ${seasonLabel(wk.league, wk.season)}` : ""),
    h("div", { class: "actions" },
      btn("Copy set link", () => copy(link("#/s/" + id))),
      mg && btn("Rename set", () => renameSet(set)),
      mg && btn("Move to week", () => moveSet(set)),
      mg && btn("Add board", () => addBoard(set, boards.length), "primary"),
      mg && boards.some(x => !x.locked) && btn("Lock open boards", () => lockAll(boards.filter(x => !x.locked).map(x => x.id)))),
    boards.length ? boards.map(b => boardBlock(b, mg, { ...set.weeks, community_id: set.community_id, siblings: boards.length })) : h("p", { class: "empty" }, mg ? "Add a board for each game in this set." : "No boards posted yet.")
  );
}

async function viewBoard(id) {
  const b = must(await sb.from("boards").select("*, board_sets(id,name,community_id,week_id)").eq("id", id).maybeSingle());
  if (!b) throw new Error("Board not found. Check the link.");
  const mg = canManage(b.board_sets.community_id);
  const wk = must(await sb.from("weeks").select("*").eq("id", b.board_sets.week_id).maybeSingle());
  const owner = mg || (S.me && b.managed_by === S.me.id);
  render(
    h("div", { class: "crumbs" }, h("a", { href: "#/s/" + b.board_sets.id }, b.board_sets.name)),
    boardBlock(b, mg, { ...(wk || {}), community_id: b.board_sets.community_id, siblings: 1 }),
    owner ? await helpersPanel(b) : null
  );
}

/* ---------- Scores and winning squares ----------
   ESPN scores are pulled by the "pull-scores" function in Supabase, which asks ESPN
   directly and saves the result. Anyone viewing can trigger it, but nobody can fake it.
   Admins can still type scores by hand for any league. */
const ESPN_LEAGUES = ["NFL", "College Football", "NBA", "WNBA", "Men's College Basketball", "Women's College Basketball", "MLB", "NHL", "MLS"];
const SLOTS = [["q1", "Q1"], ["q2", "Q2"], ["q3", "Q3"], ["final", "Final"]];
function canPull(ctx) {
  const L = leagueFor(ctx?.league);
  return !!L && ESPN_LEAGUES.includes(L.name) && (L.mode === "date" || L.weeks.includes(ctx.label));
}
async function pullScores(b) {
  const { data, error } = await sb.functions.invoke("pull-scores", { body: { board_id: b.id } });
  if (error) throw new Error("Couldn't update the score right now. " + (error.message || ""));
  if (data?.error) throw new Error(data.error);
  return data;
}
// Winning square for each slot: last digit of each team's score, matched to the drawn numbers
function winners(b) {
  const sc = b.scores || {}, map = new Map(), by = {};
  for (const [k, lbl] of SLOTS) {
    const s = sc[k];
    if (!s) continue;
    const c = b.top_nums.indexOf(s.top % 10), r = b.side_nums.indexOf(s.side % 10);
    const idx = c >= 0 && r >= 0 ? r * 10 + c + 1 : null;
    by[k] = { ...s, idx };
    if (idx) map.set(idx, [...(map.get(idx) || []), lbl === "Final" ? "F" : lbl]);
  }
  return { map, by };
}

async function editScores(b, ctx, refresh) {
  const sc = b.scores || {}, T = b.top_team || "Top team", S = b.side_team || "Side team";
  const fields = [];
  for (const [k, lbl] of SLOTS) fields.push(
    { name: k + "_top", label: `${lbl}: ${T}`, type: "number", inputmode: "numeric", min: 0, value: sc[k]?.top ?? "", half: true },
    { name: k + "_side", label: `${lbl}: ${S}`, type: "number", inputmode: "numeric", min: 0, value: sc[k]?.side ?? "", half: true });
  const espnOk = canPull(ctx);
  const v = await modal({ title: "Scores",
    text: espnOk ? "Pull the game from ESPN and it keeps updating on its own. Typing scores in turns ESPN off for this board until you pull again."
                 : "Type each team's total score at the end of each quarter.",
    fields, ok: "Save scores",
    extra: [...(espnOk ? [{ label: "Pull from ESPN", action: "pull", cls: "primary" }] : []),
            ...(Object.keys(sc).length ? [{ label: "Clear", action: "clear", cls: "danger" }] : [])] });
  if (!v) return;
  try {
    if (v.__action === "pull") {
      toast("Checking ESPN...");
      must(await sb.rpc("set_scores", { bid: b.id, sc: {}, ev: b.espn_event }));   // clears typed scores so ESPN takes over
      const row = await pullScores(b);
      refresh(row);
      const s2 = row.scores || {};
      return toast(s2.note ? s2.note : s2.state === "pre" ? "Game found. Scores fill in once it starts." : "Scores updated from ESPN", !!s2.note);
    }
    if (v.__action === "clear") return refresh(must(await sb.rpc("set_scores", { bid: b.id, sc: {}, ev: null })));
    const out = { state: "manual" };
    for (const [k] of SLOTS) {
      const t = String(v[k + "_top"]).trim(), s = String(v[k + "_side"]).trim();
      out[k] = t !== "" && s !== "" ? { top: Math.max(0, Math.floor(Number(t)) || 0), side: Math.max(0, Math.floor(Number(s)) || 0) } : null;
    }
    refresh(must(await sb.rpc("set_scores", { bid: b.id, sc: out, ev: b.espn_event })));
  } catch (e) { toast(e.message, true); }
}

// Viewers' "Update score" button: same ESPN check, saved for everyone
async function viewerPull(b, refresh) {
  try {
    toast("Checking ESPN...");
    const row = await pullScores(b);
    refresh(row);
    toast(row.scores?.note || (row.scores?.state === "pre" ? "Game hasn't started yet" : "Score is up to date"), !!row.scores?.note);
  } catch (e) { toast(e.message, true); }
}

// One timer per page asks for every open board's score in a single request:
// every 15 seconds while a game is on (or about to start), every minute otherwise.
// A board drops off for good once its final score is in (or scores were typed by hand).
// The server decides whether ESPN actually needs checking (at most every 12 seconds per
// board, and not at all until 15 minutes before kickoff).
const FAST_MS = 15000, SLOW_MS = 60000;
const WATCH = new Map(), LAST_PULL = new Map();
let WATCH_TIMER = null, WATCH_MS = 0, POLL_SOON = null;
function stopWatching() { WATCH.clear(); clearInterval(WATCH_TIMER); WATCH_TIMER = null; WATCH_MS = 0; }
function watchLive(b, ctx, mg, refresh) {
  const sc = b.scores || {};
  if (!canPull(ctx) || sc.state === "manual" || sc.state === "post" || sc.final) { WATCH.delete(b.id); return scheduleWatch(); }
  WATCH.set(b.id, { b, refresh });
  scheduleWatch();
  if (Date.now() - (LAST_PULL.get(b.id) || 0) > 10000) { clearTimeout(POLL_SOON); POLL_SOON = setTimeout(pollWatched, 100); }  // check when the board opens
}
function scheduleWatch() {
  const fast = [...WATCH.values()].some(({ b }) => {
    const sc = b.scores || {}, start = Date.parse(sc.game_date || "");
    return sc.state === "in" || (Number.isFinite(start) && start - Date.now() < 15 * 60000);
  });
  const ms = !WATCH.size ? 0 : fast ? FAST_MS : SLOW_MS;
  if (ms === WATCH_MS) return;
  clearInterval(WATCH_TIMER); WATCH_TIMER = ms ? setInterval(pollWatched, ms) : null; WATCH_MS = ms;
}
async function pollWatched() {
  const ids = [...WATCH.keys()];
  if (!ids.length) return;
  ids.forEach(id => LAST_PULL.set(id, Date.now()));
  try {
    const { data, error } = await sb.functions.invoke("pull-scores", { body: { board_ids: ids } });
    if (error || !data?.boards) return;
    for (const row of data.boards) {
      const w = WATCH.get(row.id);
      if (w && !row.error && JSON.stringify(row.scores) !== JSON.stringify(w.b.scores)) w.refresh(row);
    }
  } catch { /* try again next round */ }
}

/* ---------- Board block ---------- */
function boardBlock(b, mg, ctx) {
  const helper = !mg && S.helper?.has(b.id);          // helper on this one board
  const canEdit = mg || helper;
  const owner = mg || (S.me && b.managed_by === S.me.id);
  const editable = canEdit && !b.locked;
  const block = h("section", { class: "block", "data-board": b.id });
  const refresh = nb => {
    const { board_sets } = b;
    // The page may have been redrawn since this board was built; update whatever copy is on screen now
    const cur = block.isConnected ? block : document.querySelector(`section[data-board="${b.id}"]`);
    if (!cur) return;
    const nw = boardBlock({ ...nb, board_sets }, mg, ctx);
    cur.replaceWith(nw);
    requestAnimationFrame(fitBoards);
  };
  const sheet = renderSheet(b, editable, refresh);
  block.append(
    h("div", { class: "bar" },
      h("span", { class: "status " + (b.locked ? "locked" : "open") }, b.locked ? "Locked" : "Open"),

      b.scores?.state === "in" && h("span", { class: "status live" }, "Live"),
      btn("Save image", () => saveImage(sheet, b)),
      canShareFiles() ? btn("Share image", () => shareImage(sheet, b)) : null,
      btn("Copy link", () => copy(link("#/b/" + b.id))),
      canEdit && btn("Scores", () => editScores(b, ctx, refresh)),
      !canEdit && canPull(ctx) && b.scores?.state !== "post" && b.scores?.state !== "manual" && !b.scores?.final && btn("Update score", () => viewerPull(b, refresh)),
      mg && !b.locked && btn("Edit details", () => editDetails(b, refresh)),
      editable && btn("Lock board", () => lockBoard(b, refresh)),
      b.locked && isSuper() && btn("Unlock", () => unlockBoard(b, refresh), "primary"),
      mg && !b.locked && btn("Move board", () => moveBoard(b, ctx)),
      mg && !b.locked && ctx?.siblings > 1 && btn("Move up", () => reorderBoard(b, -1, ctx)),
      mg && !b.locked && ctx?.siblings > 1 && btn("Move down", () => reorderBoard(b, 1, ctx)),
      mg && !b.locked && btn("Delete", () => deleteBoard(b), "danger"),
      owner && btn("Helpers", () => go("#/b/" + b.id)),
      b.locked_at
        ? h("span", { class: "lockstamp" }, `${b.locked_auto ? "Auto Locked" : "Locked"} ${lockTime(b.locked_at)}`)
        : (b.scores?.game_date
            ? h("span", { class: "lockstamp" }, `Auto locks ${lockTime(new Date(Date.parse(b.scores.game_date) - 5 * 60000))}`)
            : null)),
    h("div", { class: "fit" }, sheet)
  );
  watchLive(b, ctx, mg, refresh);
  return block;
}

function renderSheet(b, editable, refresh) {
  const win = winners(b), sc = b.scores || {};
  const clickable = fn => editable ? {
    role: "button", tabindex: "0", onclick: fn,
    onkeydown: e => { if (e.key === "Enter" || e.key === " ") { e.preventDefault(); fn(); } }
  } : {};
  // Dividers between colored number boxes: light lines on dark colors, dark lines on light colors.
  const divider = c => textOn(c) === "#FFFFFF" ? "#FFFFFF" : "var(--rule)";
  const numStyle = (c, axis, last) => `background:${c};color:${textOn(c)};` + (last ? "" :
    (axis === "top" ? `border-right:2px solid ${divider(c)}` : `border-bottom:2px solid ${divider(c)}`));
  const grid = h("div", { class: "grid" },
    h("div", { class: "corner" }),
    h("div", { class: "tlabel" }, h("span", { class: "team", style: "color:" + b.top_color }, b.top_team)),
    h("div", { class: "slabel" }, h("div", {}, h("span", { class: "team", style: "color:" + b.side_color }, b.side_team)))
  );
  for (let i = 0; i < 10; i++) {
    grid.append(h("div", {
      class: "num" + (i === 9 ? " c10" : ""), style: `grid-row:2;grid-column:${i + 3};` + numStyle(b.top_color, "top", i === 9),
      "aria-label": `Top number ${i + 1}`, ...clickable(() => editNumber(b, "top", i + 1, refresh))
    }, b.top_nums[i] ?? ""));
    grid.append(h("div", {
      class: "num" + (i === 9 ? " r10" : ""), style: `grid-row:${i + 3};grid-column:2;` + numStyle(b.side_color, "side", i === 9),
      "aria-label": `Side number ${i + 1}`, ...clickable(() => editNumber(b, "side", i + 1, refresh))
    }, b.side_nums[i] ?? ""));
  }
  for (let r = 0; r < 10; r++) for (let c = 0; c < 10; c++) {
    const idx = r * 10 + c + 1;
    const wins = win.map.get(idx);
    grid.append(h("div", {
      class: "sq" + (c === 9 ? " c10" : "") + (r === 9 ? " r10" : "") + (wins ? " win" : ""),
      style: `grid-row:${r + 3};grid-column:${c + 3}`,
      "aria-label": `Square ${idx}${b.squares[idx - 1] ? ", " + b.squares[idx - 1] : ""}`,
      ...clickable(() => editSquare(b, idx, refresh))
    }, wins && h("span", { class: "wb" }, wins.join(" ")), h("span", { class: "nm" }, b.squares[idx - 1] || ""), h("span", { class: "no" }, idx)));
  }
  return h("div", { class: "sheet" + (editable ? " edit" : ""), "data-cap": b.id },
    b.managed_by_name && h("div", { class: "sheettop" }, h("span", {}, `Managed by ${b.managed_by_name}`)),
    h("div", { class: "kick" }, b.kickoff),
    (sc.state === "pre" && sc.game_date)
      ? h("div", { class: "gstat" }, `Kickoff ${lockTime(sc.game_date)}`)
      : (sc.detail ? h("div", { class: "gstat" + (sc.state === "in" ? " on" : "") },
          `${sc.detail}: ${b.top_team} ${sc.top_now}, ${b.side_team} ${sc.side_now}`) : null),
    h("div", { class: "shead" }, h("div", { class: "title" }, `${b.sport ? b.sport + " " : ""}Squares`), h("div", { class: "price" }, `${money(b.price)} per square`)),
    h("div", { class: "smain" }, grid,
      h("div", { class: "pay" }, SLOTS.map(([k, lbl]) => {
        const w = win.by[k];
        if (!w) return h("div", {}, h("b", {}, lbl + ":"), h("span", {}, money(b[k])));
        const name = w.idx ? (b.squares[w.idx - 1] || "") : "";
        // Winner's name is the headline of the box; amount and score sit under it
        return h("div", { class: "won" }, h("b", {}, lbl + ":"),
          h("div", { class: "who" + (name ? "" : " none") }, name || (w.idx ? `Square ${w.idx}` : "Draw numbers")),
          h("div", { class: "amt" }, money(b[k])),
          h("div", { class: "sc" }, `${w.top}-${w.side}`));
      }))),
    b.footer && h("div", { class: "foot" }, b.footer)
  );
}

/* ---------- Board actions ---------- */
async function editSquare(b, idx, refresh) {
  const cur = b.squares[idx - 1] || "";
  const v = await modal({ title: `Square ${idx}`, fields: [{ name: "name", label: "Name", value: cur, maxlength: 40, placeholder: "Who owns this square" }],
    ok: "Save name", extra: cur ? [{ label: "Clear square", action: "clear", cls: "danger" }] : [] });
  if (!v) return;
  const val = v.__action === "clear" ? "" : v.name.trim();
  try { refresh(must(await sb.rpc("set_square", { bid: b.id, idx, val }))); }
  catch (e) { toast(e.message, true); }
}

async function editNumber(b, axis, idx, refresh) {
  const arr = axis === "top" ? b.top_nums : b.side_nums;
  const team = (axis === "top" ? b.top_team : b.side_team) || (axis === "top" ? "Top" : "Side");
  const v = await modal({ title: `${team}: box ${idx}`, text: "Enter the drawn number, 0 to 9. Leave blank to clear.",
    fields: [{ name: "n", label: "Number", type: "number", inputmode: "numeric", min: 0, max: 9, step: 1, value: arr[idx - 1] ?? "" }], ok: "Save number" });
  if (!v) return;
  const raw = String(v.n).trim();
  const val = raw === "" ? null : Number(raw);
  if (val !== null && !(Number.isInteger(val) && val >= 0 && val <= 9)) return toast("Use a single number from 0 to 9.", true);
  try { refresh(must(await sb.rpc("set_number", { bid: b.id, axis, idx, val }))); }
  catch (e) { toast(e.message, true); }
}

function detailFields(b = {}) {
  return [
    { name: "sport", label: "Sport", value: b.sport ?? "Football", list: "sport-list", maxlength: 30, placeholder: "Football, Basketball, or type one" },
    { name: "top_team", label: "Top team", value: b.top_team, half: true, maxlength: 40, list: "team-list", placeholder: "Start typing a team" },
    { name: "top_color", label: "Top team color", type: "color", value: b.top_color || "#F7941D", half: true },
    { name: "side_team", label: "Side team", value: b.side_team, half: true, maxlength: 40, list: "team-list", placeholder: "Start typing a team" },
    { name: "side_color", label: "Side team color", type: "color", value: b.side_color || "#FFE14D", half: true },
    { name: "kickoff", label: "Kickoff line", value: b.kickoff, placeholder: "2:30 kickoff", maxlength: 60 },
    { name: "price", label: "Price per square", type: "number", step: "0.01", min: 0, inputmode: "decimal", value: b.price ?? 6, half: true },
    { name: "q1", label: "Q1 payout", type: "number", step: "0.01", min: 0, inputmode: "decimal", value: b.q1 ?? 125, half: true },
    { name: "q2", label: "Q2 payout", type: "number", step: "0.01", min: 0, inputmode: "decimal", value: b.q2 ?? 125, half: true },
    { name: "q3", label: "Q3 payout", type: "number", step: "0.01", min: 0, inputmode: "decimal", value: b.q3 ?? 125, half: true },
    { name: "final", label: "Final payout", type: "number", step: "0.01", min: 0, inputmode: "decimal", value: b.final ?? 125, half: true },
    { name: "footer", label: "Bottom note", value: b.footer ?? "NO PAY, NO PLAY!", maxlength: 60, half: true }
  ];
}
function wireTeams(inputs) {
  wireTeamLookup(inputs, "top_team", "top_color");
  wireTeamLookup(inputs, "side_team", "side_color");
}
function cleanDetails(v) {
  const num = x => { const n = Number(x); return Number.isFinite(n) && n >= 0 ? n : 0; };
  return { sport: v.sport.trim(), top_team: v.top_team.trim(), top_color: v.top_color, side_team: v.side_team.trim(), side_color: v.side_color,
    kickoff: v.kickoff.trim(), price: num(v.price), q1: num(v.q1), q2: num(v.q2), q3: num(v.q3), final: num(v.final), footer: v.footer.trim() };
}

async function addBoard(set, count) {
  teamDatalist(); setList("sport-list", SPORTS);
  const sport = leagueFor(set.weeks?.league)?.sport ?? "";
  const v = await modal({ title: "Add board", fields: detailFields({ sport }), ok: "Add board", after: wireTeams });
  if (!v) return;
  try { must(await sb.from("boards").insert({ set_id: set.id, sort_order: count, ...cleanDetails(v) })); route(); }
  catch (e) { toast(e.message, true); }
}

async function editDetails(b, refresh) {
  teamDatalist(); setList("sport-list", SPORTS);
  const v = await modal({ title: "Edit details", fields: detailFields(b), ok: "Save details", after: wireTeams });
  if (!v) return;
  try {
    const rows = must(await sb.from("boards").update(cleanDetails(v)).eq("id", b.id).select());
    if (!rows.length) return toast("Board is locked or you don't have edit rights.", true);
    refresh(rows[0]);
  } catch (e) { toast(e.message, true); }
}

// Quick way to close out everything still open
async function lockAll(ids) {
  if (!ids.length) return toast("Nothing open to lock.");
  if (!await confirmBox("Lock open boards?", `${ids.length} board${ids.length === 1 ? "" : "s"} will be locked. Only the super admin can unlock.`, "Lock them", "primary")) return;
  let n = 0;
  for (const id of ids) {
    try { const rows = must(await sb.from("boards").update({ locked: true }).eq("id", id).select()); if (rows.length) n++; }
    catch (e) { toast(e.message, true); }
  }
  toast(`${n} board${n === 1 ? "" : "s"} locked`);
  route();
}

// Helpers can work on one board only: names, numbers, scores and locking
async function helpersPanel(b) {
  const wrap = h("section", { class: "block" });
  const list = h("ul", { class: "list" });
  const load = async () => {
    const rows = must(await sb.rpc("board_helpers", { bid: b.id })) || [];
    list.replaceChildren(...(rows.length ? rows.map(r => h("li", {},
      h("div", {}, h("b", {}, r.display_name), h("div", { class: "meta" }, r.email)),
      btn("Remove", async () => {
        try { must(await sb.rpc("board_remove_helper", { bid: b.id, uid: r.user_id })); await load(); toast("Helper removed"); }
        catch (e) { toast(e.message, true); }
      }, "danger")))
      : [h("p", { class: "empty" }, "No helpers yet.")]));
  };
  await load();
  wrap.append(
    h("h2", {}, "Helpers on this board"),
    h("p", { class: "sub" }, "Helpers fill in names, draw numbers, update scores and can lock this board. Nothing else, and no other board."),
    h("div", { class: "actions" }, btn("Add helper", async () => {
      const v = await modal({ title: "Add helper", text: "They need to create a login first.",
        fields: [{ name: "email", label: "Their login email", type: "email", required: true }], ok: "Add helper" });
      if (!v) return;
      try {
        const msg = must(await sb.rpc("board_add_helper", { bid: b.id, e: v.email }));
        if (msg !== "added") return toast(msg, true);
        await load(); toast("Helper added");
      } catch (e) { toast(e.message, true); }
    }, "primary")),
    list);
  return wrap;
}

async function lockBoard(b, refresh) {
  if (!await confirmBox("Lock this board?", "No one can change it after this. Only the super admin can unlock it.", "Lock board", "primary")) return;
  try {
    const rows = must(await sb.from("boards").update({ locked: true }).eq("id", b.id).select());
    if (!rows.length) return toast("Couldn't lock. The board may already be locked.", true);
    refresh(rows[0]); toast("Board locked");
  } catch (e) { toast(e.message, true); }
}

async function unlockBoard(b, refresh) {
  if (!isSuper()) return toast("Only the super admin can unlock a board.", true);
  const v = await modal({ title: "Unlock board", text: "Enter your super admin password to unlock.",
    fields: [{ name: "pw", label: "Password", type: "password", autocomplete: "current-password", required: true }], ok: "Unlock" });
  if (!v) return;
  const { error } = await sb.auth.signInWithPassword({ email: S.session.user.email, password: v.pw });
  if (error) return toast("Wrong password. Board is still locked.", true);
  try {
    const rows = must(await sb.from("boards").update({ locked: false }).eq("id", b.id).select());
    if (!rows.length) return toast("Couldn't unlock this board.", true);
    refresh(rows[0]); toast("Board unlocked");
  } catch (e) { toast(e.message, true); }
}

async function moveBoard(b, ctx) {
  const setId = b.set_id;
  const cid = ctx?.community_id || b.board_sets?.community_id;
  const sets = must(await sb.from("board_sets").select("id,name,weeks(label,league,season)").eq("community_id", cid));
  if (sets.length < 2) return toast("Make another board set first.", true);
  const v = await modal({ title: "Move board", text: `Move ${boardName(b)} to a different board set.`,
    fields: [{ name: "set", label: "Board set", value: setId,
      options: sets.map(x => ({ value: x.id, label: `${x.name} — ${x.weeks?.label || ""}` })) }], ok: "Move board" });
  if (!v || v.set === setId) return;
  try {
    const rows = must(await sb.from("boards").update({ set_id: v.set }).eq("id", b.id).select());
    if (!rows.length) return toast("Board is locked or you don't have edit rights.", true);
    location.hash.startsWith("#/b/") ? go("#/s/" + v.set) : route();
  } catch (e) { toast(e.message, true); }
}

async function reorderBoard(b, dir, ctx) {
  try {
    const list = must(await sb.from("boards").select("id,sort_order,created_at").eq("set_id", b.set_id))
      .sort((x, y) => x.sort_order - y.sort_order || String(x.created_at).localeCompare(String(y.created_at)));
    const i = list.findIndex(x => x.id === b.id), j = i + dir;
    if (i < 0 || j < 0 || j >= list.length) return;
    // Renumber the whole set so ties can't leave two boards stuck together
    const order = list.map(x => x.id);
    order.splice(j, 0, ...order.splice(i, 1));
    for (let k = 0; k < order.length; k++) must(await sb.from("boards").update({ sort_order: k }).eq("id", order[k]));
    route();
  } catch (e) { toast(e.message, true); }
}

async function deleteBoard(b) {
  if (!await confirmBox("Delete board?", `${boardName(b)} and every name on it will be deleted.`, "Delete board")) return;
  try {
    const rows = must(await sb.from("boards").delete().eq("id", b.id).select());
    if (!rows.length) return toast("Board is locked or you don't have edit rights.", true);
    if (location.hash.startsWith("#/b/")) go("#/s/" + b.set_id); else route();
  } catch (e) { toast(e.message, true); }
}

// Renders the board to a PNG. mode "download" saves the file, "share" opens the share sheet.
async function boardImage(sheet, b) {
  await document.fonts?.ready;
  const canvas = await html2canvas(sheet, {
    scale: 2, backgroundColor: "#ffffff", useCORS: true,
    windowWidth: SHEET_W + 40,
    onclone: doc => {
      const el = doc.querySelector(`[data-cap="${b.id}"]`);
      if (!el) return;
      el.classList.remove("edit");
      el.style.cssText = "position:static;transform:none;box-shadow:none;margin:0";
      doc.body.style.background = "#ffffff";
      doc.body.replaceChildren(el);
    }
  });
  const blob = await new Promise(r => canvas.toBlob(r, "image/png"));
  const name = (boardName(b) + (b.kickoff ? " " + b.kickoff : "")).replace(/[^\w\- ]+/g, "").trim().replace(/\s+/g, "-") + ".png";
  return { blob, name };
}

async function saveImage(sheet, b) {
  try {
    const { blob, name } = await boardImage(sheet, b);
    const a = h("a", { href: URL.createObjectURL(blob), download: name });
    document.body.append(a); a.click(); a.remove();
    setTimeout(() => URL.revokeObjectURL(a.href), 4000);
  } catch (e) { toast("Couldn't create the image: " + e.message, true); }
}

async function shareImage(sheet, b) {
  try {
    const { blob, name } = await boardImage(sheet, b);
    const file = new File([blob], name, { type: "image/png" });
    if (navigator.canShare?.({ files: [file] })) {
      try { await navigator.share({ files: [file], title: boardName(b) }); }
      catch (e) { if (e.name !== "AbortError") toast("Couldn't share the image.", true); }
      return;
    }
    toast("Sharing isn't available here. Use Save image instead.", true);
  } catch (e) { toast("Couldn't create the image: " + e.message, true); }
}

const canShareFiles = () => {
  try { return !!navigator.canShare?.({ files: [new File([new Blob()], "x.png", { type: "image/png" })] }); }
  catch { return false; }
};

/* ---------- Start ---------- */
(async () => {
  if (CONFIGURED) {
    try { await loadMe(); } catch (e) { console.error(e); }
    sb.auth.onAuthStateChange(ev => {
      if (ev === "SIGNED_OUT") setTimeout(async () => { await loadMe(); route(); }, 0);
    });
  }
  route();
  if (/type=recovery/.test(location.hash) || /type=recovery/.test(location.search)) handleRecovery();
})();
</script>
