<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Game Town Square</title>
<script>try{document.documentElement.dataset.theme=localStorage.getItem("gts-theme")||"light"}catch(e){document.documentElement.dataset.theme="light"}</script>
<link rel="icon" href="brand/favicon.svg" type="image/svg+xml">
<link rel="icon" href="brand/favicon.ico" sizes="any">
<link rel="apple-touch-icon" href="brand/apple-touch-icon.png">
<meta name="theme-color" content="#2B211B">
<link rel="manifest" href="manifest.webmanifest">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Game Town">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Barlow:wght@400;600;700&family=Kalam:wght@400;700&family=Saira+Extra+Condensed:wght@800&display=swap" rel="stylesheet">
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.116.0/dist/umd/supabase.js" integrity="sha384-iLddHTLokph6Omwoyid4XKxHaWa6w41BnoEj0q5oOrzmYPpHIKt1wyjReA7s//pP" crossorigin="anonymous"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/html2canvas/1.4.1/html2canvas.min.js" integrity="sha384-ZZ1pncU3bQe8y31yfZdMFdSpttDoPmOZg2wguVK9almUodir1PghgT0eY7Mrty8H" crossorigin="anonymous"></script>
<style>
:root{
  --table:#2B211B; --table-2:#33271F; --chalk:#F2EEE9; --chalk-dim:#BDB3A8;
  --grain:rgba(255,255,255,.018); --line:rgba(255,255,255,.1); --line-2:rgba(255,255,255,.2);
  --card:rgba(255,255,255,.07); --card-edge:inset 0 1px 0 rgba(255,255,255,.18), inset 0 0 0 1px rgba(255,255,255,.1);
  --btn:rgba(255,255,255,.12); --btn-h:rgba(255,255,255,.2); --btn-edge:inset 0 1px 0 rgba(255,255,255,.35), inset 0 0 0 1px rgba(255,255,255,.18), 0 2px 10px rgba(0,0,0,.28);
  --pick:rgba(255,255,255,.06); --pick-h:rgba(255,255,255,.12); --pick-edge:rgba(255,255,255,.14);
  --good-ink:#B9E6BC; --bad-ink:#FFC9C4; --err:#FFB4AB; --gold-ink:#F2B61D; --savebar:rgba(43,33,27,.92); --bline:rgba(242,238,233,.4);
  --solid:#F2EEE9; --solid-ink:#1B1511; --hero:#33271F; --hero-line:#4A3C32; --hero-tile:#43362C; --tile:#43362C;
  --chip:#3A2E26; --chip-ink:#C9BFB4; --nav:#2A211B; --nav-shadow:0 6px 20px rgba(0,0,0,.45), inset 0 0 0 1px #3E322A;
  --paper:#FFFFFF; --ink:#1D1D1D; --rule:#3A3A3A; --muted:#6B6B6B;
  --marker:#1F4FD1; --danger:#B3261E; --ok:#2E7D32;
  --hand:'Kalam',cursive; --ui:'Barlow',system-ui,sans-serif; --display:'Saira Extra Condensed','Arial Narrow',sans-serif;
}
*{box-sizing:border-box}
/* Light theme: cream ground, white cards, dark "Up next" card */
:root[data-theme="light"]{
  --table:#F6F2EC; --table-2:#EFE7DC; --chalk:#1F1915; --chalk-dim:#5E544C;
  --grain:transparent; --line:#E6DED3; --line-2:#D6CCBF;
  --card:#FFFFFF; --card-edge:inset 0 0 0 1px #E6DED3;
  --btn:#FFFFFF; --btn-h:#F3EDE4; --btn-edge:inset 0 0 0 1px #DDD4C8, 0 1px 3px rgba(43,33,27,.08);
  --pick:#F6F2EC; --pick-h:#EFE7DC; --pick-edge:#E6DED3;
  --good-ink:#1E6B2A; --bad-ink:#A3261C; --err:#A3261C; --gold-ink:#8A6200; --savebar:rgba(255,255,255,.96); --bline:rgba(31,25,21,.35);
  --solid:#1F1915; --solid-ink:#F6F2EC; --hero:#2B211B; --hero-line:#2B211B; --hero-tile:#3A2E26; --tile:#2B211B;
  --chip:#EFE7DC; --chip-ink:#5E544C; --nav:#FFFFFF; --nav-shadow:0 6px 20px rgba(43,33,27,.12), inset 0 0 0 1px #E6DED3;
}
:root{padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
html,body{margin:0}
body{
  font:400 16px/1.45 var(--ui); color:var(--chalk); min-height:100vh;
  background:var(--table) repeating-linear-gradient(94deg,var(--grain) 0 2px,transparent 2px 9px);
}
a{color:inherit}
button,input{font:inherit}
:focus-visible{outline:3px solid #7FA6FF;outline-offset:2px}

/* ---------- App chrome ---------- */
.top{display:flex;align-items:center;justify-content:space-between;gap:12px;padding:12px 16px;border-bottom:1px solid var(--line)}
.brand{display:flex;align-items:center;gap:8px;font:800 26px/1 var(--display);letter-spacing:.5px;text-decoration:none;color:var(--chalk);white-space:nowrap}
.brand .mark{flex-shrink:0}
.brand{min-width:0}
.bname{overflow:hidden;text-overflow:ellipsis}
.who{display:flex;align-items:center;gap:10px;font-size:14px;color:var(--chalk-dim);min-width:0}
.who span{overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.whoname{background:none;border:0;color:inherit;font:inherit;padding:4px 0;cursor:pointer;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;min-width:0;text-decoration:underline dotted;text-underline-offset:3px}
.sheettop{display:flex;justify-content:space-between;gap:12px;font:700 15px/1.2 var(--ui);color:#444;margin-bottom:-18px}
.sheettop .stamps{display:flex;flex-direction:column;align-items:flex-end;gap:2px;font:600 13px/1.25 var(--ui);color:#666;text-align:right}
.bar .barmenu{margin-left:auto;flex-shrink:0}
.barmenu svg{stroke-width:3;width:24px;height:24px}
.lockstamp + .barmenu{margin-left:0}
/* Lock time stays on the board's top line on every screen; it wraps instead of getting pushed out */
.lockstamp{margin-left:auto;flex:1 1 auto;min-width:0;text-align:right;font-size:14px;font-weight:700;line-height:1.25;color:var(--chalk-dim)}
@media (max-width:480px){.lockstamp{font-size:13px}}
.who .btn{white-space:nowrap;flex-shrink:0}
.wrap{max-width:1040px;margin:0 auto;padding:18px 16px 60px}
h1{font:800 42px/1 var(--display);margin:6px 0 4px;letter-spacing:.3px}
h2{font:700 20px/1.2 var(--ui);margin:28px 0 10px}
.sub{color:var(--chalk-dim);margin:0 0 14px}
.crumbs{font-size:14px;color:var(--chalk-dim)}
.crumbs a{color:var(--chalk-dim)}
.actions{display:flex;flex-wrap:wrap;gap:8px;margin:12px 0}
/* Frosted glass buttons over the dark background */
.btn{min-height:42px;padding:9px 16px;border:0;border-radius:10px;font-weight:600;cursor:pointer;
  color:var(--chalk);background:var(--btn);
  -webkit-backdrop-filter:blur(14px) saturate(160%);backdrop-filter:blur(14px) saturate(160%);
  box-shadow:var(--btn-edge);
  transition:background .15s ease, transform .1s ease}
.btn:hover{background:var(--btn-h)}
.btn:active{transform:translateY(1px)}
.btn.primary{background:rgba(88,132,255,.38);box-shadow:inset 0 1px 0 rgba(255,255,255,.45), inset 0 0 0 1px rgba(150,180,255,.5), 0 2px 12px rgba(31,79,209,.35)}
.btn.primary:hover{background:rgba(88,132,255,.5)}
.btn.danger{color:#FFC9C4;background:rgba(220,70,60,.22);box-shadow:inset 0 1px 0 rgba(255,255,255,.25), inset 0 0 0 1px rgba(255,120,110,.4), 0 2px 10px rgba(0,0,0,.28)}
.btn.danger:hover{background:rgba(220,70,60,.34)}
.btn.ghost{background:var(--pick)}
:root[data-theme="light"] .btn.primary{color:var(--solid-ink);background:var(--solid);box-shadow:0 2px 8px rgba(31,25,21,.2)}
:root[data-theme="light"] .btn.primary:hover{background:#3A2E26}
:root[data-theme="light"] .btn.danger{color:#8C1D18;background:rgba(179,38,30,.1);box-shadow:inset 0 0 0 1px rgba(179,38,30,.35)}
.btn:disabled{opacity:.45;cursor:default}
/* On the white panels and dialogs, the glass goes light */
.panel .btn,.modal .btn{color:var(--ink);background:rgba(20,20,20,.06);
  box-shadow:inset 0 1px 0 rgba(255,255,255,.7), inset 0 0 0 1px rgba(0,0,0,.14), 0 1px 6px rgba(0,0,0,.1)}
.panel .btn:hover,.modal .btn:hover{background:rgba(20,20,20,.11)}
.panel .btn.primary,.modal .btn.primary{color:#fff;background:rgba(31,79,209,.9);
  box-shadow:inset 0 1px 0 rgba(255,255,255,.35), 0 2px 10px rgba(31,79,209,.35)}
.panel .btn.danger,.modal .btn.danger{color:#8C1D18;background:rgba(179,38,30,.12);
  box-shadow:inset 0 1px 0 rgba(255,255,255,.6), inset 0 0 0 1px rgba(179,38,30,.35)}
.list{list-style:none;margin:0;padding:0;display:grid;gap:8px}
.list li{display:flex;align-items:center;justify-content:space-between;gap:10px;padding:12px 14px;border-radius:10px;background:var(--card);-webkit-backdrop-filter:blur(10px);backdrop-filter:blur(10px);box-shadow:var(--card-edge)}
.list a{font-weight:600;text-decoration:none}
.search{width:100%;min-height:44px;padding:10px 12px;margin:6px 0 14px;border-radius:8px;border:0;box-shadow:inset 0 0 0 1px var(--line-2);background:var(--card);color:var(--chalk);font-size:16px}
.people{display:grid;gap:10px}
.person{padding:14px;border-radius:12px;background:var(--card);-webkit-backdrop-filter:blur(10px);backdrop-filter:blur(10px);box-shadow:var(--card-edge)}
.phead{display:flex;flex-wrap:wrap;justify-content:space-between;gap:8px;margin-bottom:8px}
.tags{display:flex;flex-wrap:wrap;gap:6px}
.tag{font-size:12px;font-weight:700;padding:3px 8px;border-radius:999px;background:var(--gold-tag,#F2B61D);color:#1D1D1D}
.check{display:flex;align-items:center;gap:8px;min-height:36px;font-weight:600}
.check input{width:20px;height:20px;accent-color:var(--marker)}
.commlist{margin:6px 0 4px;padding-left:2px}
.person .actions{margin:10px 0 0}
.list a:hover{text-decoration:underline}
.meta{font-size:14px;color:var(--chalk-dim)}
.empty{color:var(--chalk-dim);padding:18px 0}
.err{color:var(--err)}
.panel{max-width:380px;margin:40px auto;padding:22px;border-radius:10px;background:var(--paper);color:var(--ink)}
.panel h1{color:var(--ink)}
.panel p{color:var(--muted)}

/* ---------- Board block ---------- */
.block{margin:26px 0 34px}
.bar{display:flex;flex-wrap:nowrap;align-items:center;gap:8px;margin-bottom:10px}
.bar .status{flex-shrink:0;white-space:nowrap}
.status{font-size:14px;font-weight:700;padding:7px 12px;border-radius:999px;margin-right:4px;-webkit-backdrop-filter:blur(10px);backdrop-filter:blur(10px);box-shadow:inset 0 0 0 1px rgba(255,255,255,.15)}
.status.open{background:rgba(46,125,50,.25);color:var(--good-ink)}
.status.locked{background:rgba(179,38,30,.2);color:var(--bad-ink)}
.fit{position:relative;width:100%;overflow:hidden}

/* ---------- The sheet (this is what gets exported) ---------- */
.sheet{position:absolute;top:0;left:0;width:980px;background:var(--paper);color:var(--ink);padding:14px 22px 16px;transform-origin:top left;box-shadow:0 10px 30px rgba(0,0,0,.45)}
.kick{text-align:center;font:700 26px/1.2 var(--hand);min-height:30px}
.shead{display:flex;justify-content:space-between;align-items:flex-start;gap:16px}
.title{font:800 78px/.92 var(--display);text-transform:uppercase;letter-spacing:1px;color:#3B3B3B;white-space:nowrap;overflow:hidden;min-width:0}
.price{font:700 18px var(--ui);color:#7A7A7A;padding-top:6px;white-space:nowrap}
.smain{display:flex;gap:14px;margin-top:10px}
.grid{flex:1;display:grid;grid-template-columns:46px 44px repeat(10,minmax(0,1fr));grid-template-rows:48px 44px repeat(10,58px);border-top:2px solid var(--rule);border-left:2px solid var(--rule)}
.grid>div{border-right:1px solid var(--rule);border-bottom:1px solid var(--rule);min-width:0}
.grid>div.c10{border-right-width:2px}
.grid>div.r10{border-bottom-width:2px}
.corner{grid-column:1/3;grid-row:1/3}
.tlabel{grid-column:3/13;grid-row:1;display:flex;align-items:center;justify-content:center;padding:0 10px;border-right-width:2px !important;overflow:hidden}
.team{font:800 40px/1 var(--display);text-transform:uppercase;letter-spacing:1px;white-space:nowrap}
.team.fx{font-weight:400;font-size:34px;letter-spacing:0;text-transform:none}
.slabel{grid-column:1;grid-row:3/13;position:relative;overflow:hidden;border-bottom-width:2px !important}
.tlabel .tlogo{height:40px;width:40px;object-fit:contain;margin-right:10px;flex-shrink:0}
.slabel .tlogo{height:40px;width:40px;object-fit:contain;margin-right:10px;flex-shrink:0;transform:rotate(90deg)}
.corner{display:flex;align-items:center;justify-content:center;overflow:hidden}
.corner .lgmark{max-width:82%;max-height:82%;object-fit:contain}
.lgbadge{display:flex;flex-direction:column;align-items:center;justify-content:center;gap:1px;width:86%;padding:9px 3px;border-radius:9px;background:#1D1D1D;color:#fff;
  box-shadow:inset 0 0 0 2px #C9C9C9;text-align:center;line-height:1}
.lgbadge span{font:700 10px/1 var(--ui);letter-spacing:1px}
.lgbadge b{font:800 17px/1 var(--display);letter-spacing:.4px}
.slabel>div{position:absolute;left:50%;top:50%;width:580px;transform:translate(-50%,-50%) rotate(-90deg);display:flex;align-items:center;justify-content:center;white-space:nowrap}
.num{display:flex;align-items:center;justify-content:center;font:800 30px/1 var(--display)}
.sq{position:relative;display:flex;align-items:center;justify-content:center;padding:11px 3px}
.sq .nm{display:block;width:100%;text-align:center;font:400 15px/1.05 var(--hand);max-height:32px;overflow:hidden;overflow-wrap:anywhere}
.sq .sqav{position:absolute;right:2px;top:2px;width:16px;height:16px;border-radius:50%;object-fit:cover;box-shadow:0 0 0 1px rgba(0,0,0,.15)}
.sq .nm.fx{font-size:13px}
.sq .no{position:absolute;right:3px;bottom:1px;font:600 10px/1 var(--ui);color:#555}
.sq.win{background:#FFE58A}
.sq .wb{position:absolute;left:2px;top:2px;font:700 9px/1 var(--ui);background:#1D1D1D;color:#FFE14D;padding:2px 3px;border-radius:3px;white-space:nowrap}
.gstat{text-align:center;font:700 15px/1.3 var(--ui);color:#444;margin-top:2px}
.gstat.on{color:#B3261E}
.pay>div.won{background:#FFF4CC}
.pay .sc{font:600 11px/1.2 var(--ui);color:#666;text-align:center;margin-top:2px}
.pay .who{display:block;width:100%;margin:auto 0 2px;font:700 24px/1.05 var(--hand);color:#1D1D1D;text-align:center;overflow-wrap:anywhere}
.pay .who.none{font:600 13px/1.2 var(--ui);color:#666}
.pay .amt{font:700 16px/1.2 var(--ui);color:#444;text-align:center}
.status.live{background:rgba(179,38,30,.9);color:#fff}
.edit .sq,.edit .num{cursor:pointer}
.edit .sq:hover{background:#EEF3FF}
.edit .num:hover{filter:brightness(.92)}
.pay{width:130px;display:flex;flex-direction:column;gap:10px;border:2px solid var(--rule);padding:10px}
.pay>div{flex:1;border:2px solid var(--rule);padding:8px;display:flex;flex-direction:column}
.pay b{font:700 14px var(--ui)}
.pay span{margin:auto 0;text-align:center;font:700 20px var(--ui);color:#666}
.foot{text-align:center;font:700 34px/1.2 var(--hand);margin-top:8px;letter-spacing:1px}

/* ---------- Theme switch + community page (new look) ---------- */
.iconbtn{width:44px;height:44px;flex-shrink:0;display:inline-flex;align-items:center;justify-content:center;border:0;border-radius:12px;cursor:pointer;color:var(--chalk);background:var(--btn);box-shadow:var(--btn-edge)}
.iconbtn:hover{background:var(--btn-h)}
.iconbtn.solid{background:var(--solid);color:var(--solid-ink);box-shadow:none}
.iconbtn.sm{width:36px;height:36px;border-radius:10px}
.iconbtn.bad{color:var(--bad-ink)}
.back{display:inline-flex;align-items:center;gap:4px;font-size:14px;font-weight:600;color:var(--chalk-dim);text-decoration:none}
.chead{display:flex;align-items:flex-start;justify-content:space-between;gap:12px;margin-top:10px}
.chead .btns{display:flex;gap:8px}
.league{display:flex;align-items:center;gap:8px;font-size:14px;color:var(--chalk-dim);margin:2px 0 16px}
.league .dot{width:10px;height:10px;border-radius:5px;background:#F2B61D;flex-shrink:0}
.cwrap{max-width:560px;margin:0 auto}
.upnext{padding:16px;border-radius:20px;background:var(--hero);box-shadow:inset 0 0 0 1px var(--hero-line);color:#F2EEE9;display:flex;flex-direction:column;gap:12px;margin-bottom:22px}
.upnext .row{display:flex;justify-content:space-between;align-items:center;gap:8px}
.upnext .lbl{font-size:13px;font-weight:600;color:#C9BFB4}
.upnext .wk{font-size:12px;font-weight:700;padding:3px 9px;border-radius:999px;background:#F2B61D;color:#1D1D1D;white-space:nowrap}
.upnext .day{font:800 34px/1 var(--display);color:#F2EEE9;text-decoration:none}
.upnext .tiles{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:8px}
.upnext .tile{padding:10px 12px;border-radius:12px;background:var(--hero-tile);color:#F2EEE9;text-decoration:none;display:flex;flex-direction:column;gap:6px;min-width:0}
.upnext .tile b{font-size:15px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.upnext .tile span{font-size:12px;color:#C9BFB4}
.upnext .fill{height:5px;border-radius:3px;background:#2B211B;overflow:hidden}
.upnext .fill i{display:block;height:5px;background:#F2B61D}
.upnext .more{font-size:14px;font-weight:600;color:#F2EEE9}
.seclbl{font-size:13px;font-weight:600;color:var(--chalk-dim);margin:0 0 10px}
.dayset{margin:0 0 22px}
.dayhead{display:flex;align-items:center;justify-content:space-between;gap:10px;margin:0 0 10px}
.dayhead h2{margin:0;font:800 24px/1.1 var(--display)}
.dayhead h2 a{color:var(--chalk);text-decoration:none}
.dayhead .actions{margin:0;flex-wrap:nowrap}
.btiles{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:8px}
.btile{padding:12px;border-radius:12px;background:var(--card);box-shadow:var(--card-edge);color:var(--chalk);text-decoration:none;display:flex;flex-direction:column;gap:6px;min-width:0}
.btile b{font-size:15px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.btile span{font-size:12px;color:var(--muted)}
.btile .fill{height:5px;border-radius:3px;background:var(--line);overflow:hidden}
.btile .fill i{display:block;height:5px;background:#F2B61D}
.wcards{display:grid;grid-template-columns:minmax(0,1fr);gap:10px;margin-bottom:20px}
.wcard{min-width:0;display:flex;gap:10px;align-items:center;padding:12px;border-radius:18px;background:var(--card);box-shadow:var(--card-edge)}
.wcard>a{flex-grow:1;display:flex;gap:14px;align-items:center;min-width:0;color:var(--chalk);text-decoration:none}
.wtile{width:60px;height:60px;flex-shrink:0;border-radius:14px;background:var(--tile);color:#F2EEE9;display:flex;flex-direction:column;align-items:center;justify-content:center;text-align:center;line-height:1}
.wtile small{font-size:11px;font-weight:700;color:#C9BFB4}
.wtile b{font:800 32px/.9 var(--display)}
.wtile b.sm{font-size:15px;line-height:1;padding:0 3px;max-width:100%;overflow:hidden}
.winfo{min-width:0;flex-grow:1;display:flex;flex-direction:column;gap:3px}
.winfo .t{display:flex;justify-content:space-between;align-items:center;gap:8px}
.winfo .t b{font-size:17px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.winfo .m{font-size:13px;color:var(--chalk-dim)}
.chip{font-size:12px;font-weight:700;padding:3px 9px;border-radius:999px;background:var(--chip);color:var(--chip-ink);white-space:nowrap}
.chip.open{background:rgba(46,125,50,.18);color:var(--good-ink)}
.wact{display:flex;flex-direction:column;gap:6px}
.tabbar{position:fixed;left:50%;transform:translateX(-50%);bottom:calc(14px + env(safe-area-inset-bottom,0px));z-index:30;width:min(520px,calc(100% - 28px));
  padding:6px;border-radius:20px;background:var(--nav);box-shadow:var(--nav-shadow);display:grid;grid-auto-flow:column;grid-auto-columns:minmax(0,1fr);gap:6px}
.tabbar a{height:56px;border-radius:14px;color:var(--chalk-dim);text-decoration:none;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:3px;font-size:12px;font-weight:700}
.tabbar a[aria-current="page"]{background:var(--solid);color:var(--solid-ink)}
main.hastabs{padding-bottom:110px}
@media (max-width:480px){
  .top{padding:10px 12px;gap:8px}
  .brand{font-size:21px;gap:6px}
  .brand .mark{width:24px;height:24px}
  .who{gap:6px}
  .who .btn{min-height:38px;padding:7px 11px;font-size:14px}
  .whoname{max-width:84px}
}

/* ---------- Bracket pools ---------- */

.drawer .iconbtn{color:var(--ink);background:transparent;box-shadow:inset 0 0 0 1px rgba(0,0,0,.18)}
@media (prefers-reduced-motion:reduce){.dscrim,.drawer{transition:none}}
.modal{width:100%;max-width:460px;max-height:90vh;overflow:auto;background:var(--paper);color:var(--ink);border-radius:12px;padding:18px}
.modal h3{margin:0 0 6px;font:700 20px var(--ui)}

.mform{display:grid;grid-template-columns:1fr 1fr;gap:10px 12px}

}

function textOn(hex) {
  const m = /^#?([0-9a-f]{6})$/i.exec(hex || "");
  if (!m) return "#1D1D1D";
  const n = parseInt(m[1], 16), r = n >> 16, g = (n >> 8) & 255, b = n & 255;

function modal({ title, text, fields = [], ok = "Save", okClass = "primary", extra = [], after }) {

            inputmode: f.inputmode, min: f.min, max: f.max, step: f.step, maxlength: f.maxlength,
            autocomplete: f.autocomplete || "off", required: f.required, list: f.list

      form.append(h("label", { class: f.half ? "half" : "" }, h("span", {}, f.label), inp));
    }
    form.append(h("div", { class: "mbtns" },
      btn("Cancel", () => close(null)),
      extra.map(x => btn(x.label, () => close({ __action: x.action }), x.cls || "")),
      h("button", { class: "btn " + okClass, type: "submit" }, ok)

      h("div", { class: "modal", role: "dialog", "aria-modal": "true", "aria-label": title },
        h("h3", {}, title), text && h("p", {}, text), form));
    document.body.append(scrim);
    document.addEventListener("keydown", onKey);
    if (after) after(inputs);
    const first = form.querySelector("input");
    (first || form.querySelector(".btn.primary, .btn.danger"))?.focus();

}

/* ---------- Auth state ---------- */
async function loadMe() {
  // Bracket pools switch (the owner turns it on for everyone)
  const sw = await sb.from("app_settings").select("key,value").in("key", ["pools_enabled", "commissioner_unlock", "votes_enabled"]);
  const setting = k => (sw.data || []).find(r => r.key === k)?.value === true;

  const uid = S.session.user.id;

/* ---------- Role announcements ----------

   they open the app. What they've already been told is saved on their profile, so it shows once. */
// Live check while the app is open: when they come back to the app, every minute while it's
// on screen, and when they move between pages (at most every 15 seconds). If their role
// changed, the page redraws with the new access and the announcement shows right away.

async function refreshRoles(force) {
  if (!S.me?.id || S.noticeOpen || document.hidden) return;
  if (!force && Date.now() - _roleCheckAt < 15000) return;
  _roleCheckAt = Date.now();
  try {
    const [{ data: p }, { data: ca }] = await Promise.all([
      sb.from("profiles").select("is_commissioner,is_super_admin,unlimited_communities,playoffs_addon").eq("id", S.me.id).maybeSingle(),
      sb.from("community_admins").select("community_id").eq("user_id", S.me.id)]);
    if (!p || !ca) return;
    const admin = new Set(ca.map(r => r.community_id));
    const changed = !!p.is_commissioner !== !!S.me.is_commissioner || !!p.is_super_admin !== !!S.me.is_super_admin ||
      !!p.unlimited_communities !== !!S.me.unlimited_communities || !!p.playoffs_addon !== !!S.me.playoffs_addon ||
      admin.size !== S.admin.size || [...admin].some(x => !S.admin.has(x));

}

  return { c: !!S.me.is_commissioner, s: !!S.me.is_super_admin, u: !!S.me.unlimited_communities, p: !!S.me.playoffs_addon, a: [...S.admin].sort() };
}
async function checkRoles() {

  const now = roleSnapshot(), was = S.me.roles_seen;
  const same = was && was.c === now.c && was.s === now.s && was.u === now.u && !!was.p === now.p && JSON.stringify([...(was.a || [])].sort()) === JSON.stringify(now.a);

  if (!was || S.me.is_owner) { await sb.rpc("ack_roles", { r: now }); S.me.roles_seen = now; return; }

    "Create new communities.",
    "Add and remove community admins (not Commissioners or Super admins).",
    "Edit locked boards.",
    S.commUnlock ? "Unlock boards." : "Unlock boards once the Board Master turns that on.",

  if (now.s && !was.s) parts.push({ head: "You're now a Super admin", items: [

    "Edit and delete locked boards.", "Use the People page."] });

  if (was.c && !now.c) gone.push("You're no longer a Commissioner.");

    fit.style.height = Math.ceil(sheet.offsetHeight * s) + "px";
  });
}

/* ---------- Router ---------- */
async function route() {
  stopWatching();
  const [key, id, sub] = location.hash.replace(/^#\/?/, "").split("?")[0].split("/");
  try {
    if (!CONFIGURED) return viewSetup();
    if (key === "b" && id) return await viewBoard(id);
    if (key === "s" && id) return await viewSet(id);
    if (key === "w" && id) return await viewWeek(id);
    if (key === "p" && id) return await viewPool(id);
    if (key === "j" && id) return await joinFromLink(id);
    if (key === "i" && id) return await joinCommunityLink(id);
    if (key === "help") return viewHelp();
    if (key === "v" && id) return await viewVote(id);
    if (key === "login" || !S.session) return viewLogin();
    if (key === "c" && id) return await viewCommunity(id, sub);
    if (key === "people") return await viewPeople();
    if (key === "me") return await viewProfile();
    if (key === "preview") return viewPreview();
    await viewHome();
    if (S.me && (!S.me.first_name || !S.me.last_name) && !S.askedName) { S.askedName = true; editName(true); }
    return;
  } catch (e) {
    render(h("p", { class: "err" }, e.message));
  }
}
addEventListener("hashchange", route);

function viewLogin(mode = "signin") {
  const creating = mode === "create";
  const inp = (type, ac, extra = {}) => h("input", { type, autocomplete: ac, ...extra });
  const first = inp("text", "given-name", { required: true, maxlength: 40 });
  const last = inp("text", "family-name", { required: true, maxlength: 40 });
  const nick = inp("text", "nickname", { maxlength: 40, placeholder: "Optional, like Coach T" });
  const email = inp("email", "email", { required: true, placeholder: "you@example.com" });
  const pass = inp("password", creating ? "new-password" : "current-password", { required: true, minlength: 6 });
  const submit = async e => {
    e.preventDefault();
    if (!creating) {
      const { error } = await sb.auth.signInWithPassword({ email: email.value.trim(), password: pass.value });
      if (error) return toast(error.message, true);
      await loadMe(); return go(afterLogin());
    }
    if (!first.value.trim() || !last.value.trim()) return toast("Enter your first and last name.", true);
    if (pass.value.length < 6) return toast("Use a password of 6 or more characters.", true);
    const { data, error } = await sb.auth.signUp({ email: email.value.trim(), password: pass.value,
      options: { data: { first_name: first.value.trim(), last_name: last.value.trim(), nickname: nick.value.trim() },
                 emailRedirectTo: link(nextHash() || "#/") } });
    if (error) return toast(error.message, true);
    if (!data.session) return toast("Check your email to confirm your login, then sign in.");
    await loadMe(); go(afterLogin());
  };
  const field = (label, el, half) => h("label", { class: half ? "half" : "" }, h("span", {}, label), el);
  const joining = /^#\/j\//.test(nextHash()), inviting = /^#\/i\//.test(nextHash());
  $app.replaceChildren(topbar(), h("div", { class: "panel" },
    h("h1", {}, creating ? "Create login" : joining || inviting ? "Sign in to join" : "Admin sign in"),
    h("p", {}, inviting ? (creating ? "Create a login to join the community and set up your profile and squares."
                                    : "Sign in to join the community. New here? Tap Create login.") : joining ? (creating ? "Create a login to make your bracket picks. Your name shows on the leaderboard."
                                   : "Sign in to join the pool and make your picks. New here? Tap Create login.")
             : creating ? "For people running boards. Your name shows on the boards you manage."
                        : "Viewers don't need to sign in. Just open the board link you were sent."),
    h("form", { class: "mform", onsubmit: submit },
      creating && [field("First name", first, true), field("Last name", last, true), field("What should we call you?", nick)],
      field("Email", email), field("Password", pass),
      h("div", { class: "mbtns" },
        btn(creating ? "I have a login" : "Create login", () => viewLogin(creating ? "signin" : "create")),
        h("button", { class: "btn primary", type: "submit" }, creating ? "Create login" : "Sign in")))));
  (creating ? first : email).focus();
}

async function editName(required = false, who = S.me) {
  const self = who?.id === S.me?.id;
  const v = await modal({ title: required ? "Add your name" : self ? "Your name" : `${displayName(who)}'s name`,
    text: self ? "This shows as the manager on boards you create." : "This changes their name everywhere it shows.",
    fields: [
      { name: "first_name", label: "First name", value: who?.first_name || "", required: true, maxlength: 40, half: true, autocomplete: "given-name" },
      { name: "last_name", label: "Last name", value: who?.last_name || "", required: true, maxlength: 40, half: true, autocomplete: "family-name" },
      { name: "nickname", label: self ? "What should we call you? (optional)" : "Nickname (optional)", value: who?.nickname || "", maxlength: 40, autocomplete: "nickname" }
    ], ok: "Save" });
  if (!v) return;
  const row = { first_name: v.first_name.trim(), last_name: v.last_name.trim(), nickname: v.nickname.trim() };
  if (!row.first_name || !row.last_name) return toast("Enter your first and last name.", true);
  try {
    const saved = must(await sb.from("profiles").update(row).eq("id", who.id).select());
    if (!saved.length) return toast("That name couldn't be changed. Only the Board Master can edit the Board Master.", true);
    await loadMe(); route(); toast("Name saved");
  } catch (e) { toast(e.message, true); }
}

/* ---------- Admin access requests ----------
   A logged-in user asks to run an existing community or start a new one.
   Nothing is active until the Board Master approves it on the People screen.
   Plans cover one community the user owns; the unlimited plan covers more. */
function requestBlock(all, req) {
  const what = r => all.find(c => c.id === r.community_id)?.name || "a community";
  if (req?.status === "pending") return h("div", { class: "panel" },
    h("p", {}, h("b", {}, "Request sent: "), what(req), ". Waiting for approval."),
    h("div", { class: "actions", style: "margin:0" }, btn("Cancel request", async () => {
      try { must(await sb.rpc("cancel_request")); route(); toast("Request canceled"); } catch (e) { toast(e.message, true); }
    })));
  return h("div", { class: "panel" },
    req?.status === "denied" && h("p", { class: "meta" }, `Your request for ${what(req)} wasn't approved.`),
    h("p", { class: "meta" }, "Want to run squares boards? Ask to be added to a community."),
    h("div", { class: "actions", style: "margin:0" }, btn("Request admin access", () => requestAccess(all), "primary")));
}
async function requestAccess(all) {
  const open = all.filter(c => !S.admin.has(c.id));
  if (!open.length) return toast("You're already an admin of every community.", true);
  const v = await modal({ title: "Request admin access", text: "A Commissioner approves your request. You'll get access once it's approved.",
    fields: [
      { name: "cid", label: "Community", value: "", options: [{ value: "", label: "Pick one" }, ...open.map(c => ({ value: c.id, label: c.name }))] },
      { name: "note", label: "Note (optional)", maxlength: 300, placeholder: "Who you are or who you run boards for" }
    ], ok: "Send request" });
  if (!v) return;
  if (!v.cid) return toast("Pick a community.", true);
  try {
    must(await sb.rpc("request_access", { k: "join", cid: v.cid, nm: null, msg: v.note }));
    route(); toast("Request sent");
  } catch (e) { toast(e.message, true); }
}
// Request card, used on the home screen and the People page
function reqCard(r) {
  return h("div", { class: "person" },
    h("div", { class: "phead" }, h("div", {}, h("b", {}, r.display_name), h("div", { class: "meta" }, r.email))),
    h("p", {}, r.kind === "new" ? `Wants a new community: "${r.new_name}"` : `Wants to run ${r.community_name}`),
    r.note && h("p", { class: "meta" }, `"${r.note}"`),
    h("div", { class: "actions" }, btn("Approve", () => decideRequest(r, true), "primary"), btn("Deny", () => decideRequest(r, false), "danger")));
}
async function decideRequest(r, approve) {
  try {
    if (!approve) {
      must(await sb.rpc("decide_request", { rid: r.id, approve: false }));
      return route(), toast("Request denied");
    }
    let nm = null;
    if (r.kind === "new") {
      const v = await modal({ title: "Approve new community", text: `${r.display_name} becomes the admin of this community.`,
        fields: [{ name: "name", label: "Community name", value: r.new_name, required: true, maxlength: 80 }], ok: "Approve" });
      if (!v || !v.name.trim()) return;
      nm = v.name.trim();
    }
    try { must(await sb.rpc("decide_request", { rid: r.id, approve: true, nm })); }
    catch (e) {
      if (!String(e.message).includes("OVER_LIMIT")) throw e;
      if (!await confirmBox("Over their plan", `${r.display_name} already owns a community and isn't on the unlimited plan. Approve anyway?`, "Approve anyway", "primary")) return;
      must(await sb.rpc("decide_request", { rid: r.id, approve: true, nm, override: true }));
    }
    route(); toast(`${r.display_name} approved`);
  } catch (e) { toast(e.message, true); }
}

async function newCommunity() {
  const v = await modal({ title: "New community", fields: [{ name: "name", label: "Community name", required: true, maxlength: 80 }], ok: "Create community" });
  if (!v || !v.name.trim()) return;
  try {
    if (isSuper()) must(await sb.from("communities").insert({ name: v.name.trim() }));
    else must(await sb.rpc("commish_new_community", { nm: v.name.trim() }));
    route();
  }
  catch (e) { toast(e.message, true); }
}

/* ---------- Game schedule (ESPN model) ----------
   Every board works the same. Only the schedule differs by league, the way ESPN does it:
   football runs in numbered weeks; basketball, baseball, hockey and soccer run by game date. */
const range = (n, f) => Array.from({ length: n }, (_, i) => f(i + 1));
const LEAGUES = {
  "NFL": { sport: "Football", mode: "week", weeks: ["Hall of Fame Weekend", ...range(3, i => `Preseason Week ${i}`), ...range(18, i => `Week ${i}`),
    "Wild Card", "Divisional Round", "Conference Championships", "Super Bowl"] },
  "College Football": { sport: "Football", mode: "week", weeks: [...range(16, i => `Week ${i}`), "Bowls"] },
  "NBA": { sport: "Basketball", mode: "date", crossYear: true },
  "WNBA": { sport: "Basketball", mode: "date" },
  "Men's College Basketball": { sport: "Basketball", mode: "date", crossYear: true },
  "Women's College Basketball": { sport: "Basketball", mode: "date", crossYear: true },
  "MLB": { sport: "Baseball", mode: "date" },
  "NHL": { sport: "Hockey", mode: "date", crossYear: true },
  "MLS": { sport: "Soccer", mode: "date" }
};
const SPORTS = ["Football", "Basketball", "Baseball", "Softball", "Hockey", "Soccer", "Volleyball", "Lacrosse"];
function leagueFor(name) {
  const k = Object.keys(LEAGUES).find(k => k.toLowerCase() === String(name || "").trim().toLowerCase());
  return k ? { name: k, ...LEAGUES[k] } : null;
}
// Football seasons run into January and February, so those months belong to last year's season.
function currentSeason() { const d = new Date(); return d.getMonth() < 2 ? d.getFullYear() - 1 : d.getFullYear(); }
// Winter leagues (NBA, NHL, college hoops) span two years; ESPN shows them as "2026-27".
const seasonLabel = (league, season) => leagueFor(league)?.crossYear ? `${season}-${String(season + 1).slice(-2)}` : String(season);
function dateParts(iso) {
  const [y, m, d] = iso.split("-").map(Number);
  const dt = new Date(Date.UTC(y, m - 1, d));
  return { y, m, key: y * 10000 + m * 100 + d,
    label: dt.toLocaleDateString("en-US", { weekday: "short", month: "short", day: "numeric", timeZone: "UTC" }) };
}
/* ---------- Week dates ----------
   Football weeks get their dates from ESPN's calendar (through the pull-scores function).
   Date-based leagues (NBA, MLB, ...) are a single game date. Typed-in leagues have no dates,
   so nothing is checked for them. If ESPN can't be reached, nothing is blocked. */
const _weekRanges = new Map();
const isoOf = k => `${String(k).slice(0, 4)}-${String(k).slice(4, 6)}-${String(k).slice(6)}`;
async function weekRange(w) {
  if (!w) return null;
  if (/^\d{8}$/.test(String(w.sort_key || ""))) { const d = isoOf(w.sort_key); return { start: d, end: d }; }
  const L = leagueFor(w.league);
  if (!L || L.mode !== "week" || !L.weeks.includes(w.label)) return null;
  const key = `${L.name}|${w.season}|${w.label}`;
  if (!_weekRanges.has(key)) _weekRanges.set(key, (async () => {
    try {
      const { data, error } = await sb.functions.invoke("pull-scores", { body: { week_dates: { league: L.name, season: w.season, label: w.label } } });
      if (!error && data?.none) return { none: true };
      return !error && data?.start && data?.end ? { start: data.start, end: data.end } : null;
    } catch { return null; }
  })().then(r => { if (!r) _weekRanges.delete(key); return r; }));
  const r = await _weekRanges.get(key);
  return r?.none ? null : r;
}
// True only when ESPN answered and has no such week that season (e.g. a Week 16 that doesn't exist)
async function weekMissing(w) {
  const L = leagueFor(w.league);
  if (!L || L.mode !== "week" || !L.weeks.includes(w.label)) return false;
  await weekRange(w);
  return !!(await _weekRanges.get(`${L.name}|${w.season}|${w.label}`))?.none;
}
const shortDate = iso => { const [y, m, d] = iso.split("-").map(Number);
  return new Date(Date.UTC(y, m - 1, d)).toLocaleDateString("en-US", { month: "short", day: "numeric", timeZone: "UTC" }); };
// "Oct 5–11", "Sep 28–Oct 4", or "Oct 10" for a single day
function rangeText(r) {
  if (!r) return "";
  if (r.start === r.end) return shortDate(r.start);
  const a = shortDate(r.start), b = shortDate(r.end);
  return a.split(" ")[0] === b.split(" ")[0] ? `${a}–${b.split(" ")[1]}` : `${a}–${b}`;
}
const addDays = (iso, n) => { const [y, m, d] = iso.split("-").map(Number);
  return new Date(Date.UTC(y, m - 1, d + n)).toISOString().slice(0, 10); };
// Which preset week a date falls in, checked against ESPN. Returns the label or "".
async function weekForDate(w, iso) {
  const L = leagueFor(w.league), r = await weekRange(w);
  if (!L || L.mode !== "week" || !r) return "";
  const i = L.weeks.indexOf(w.label) + Math.floor((Date.parse(iso) - Date.parse(r.start)) / 864e5 / 7);
  const guess = L.weeks[i];
  if (!guess) return "";
  const g = await weekRange({ league: L.name, season: w.season, label: guess });
  return g && iso >= g.start && iso <= g.end ? guess : "";
}
// null when the date fits the week; otherwise the message to show
async function dateProblem(w, iso) {
  const r = await weekRange(w);
  if (!r || (iso >= r.start && iso <= r.end)) return null;
  const right = await weekForDate(w, iso);
  return `${shortDate(iso)} isn't in ${w.label} (${rangeText(r)}).` +
    (right ? ` It's in ${right}. Create ${right} or pick a ${w.label} date.` : ` Pick a ${w.label} date.`);
}
const setDateSort = (a, b) => String(a.game_date || "9999").localeCompare(String(b.game_date || "9999")) ||
  String(a.created_at).localeCompare(String(b.created_at));

const weekSort = (a, b) => (b.season - a.season) || (b.sort_key - a.sort_key) || String(b.created_at).localeCompare(String(a.created_at));
function setList(id, values) {
  let dl = document.getElementById(id);
  if (!dl) { dl = h("datalist", { id }); document.body.append(dl); }
  dl.replaceChildren(...values.map(v => h("option", { value: v })));
}
const countOf = (n, word) => `${n} ${word}${n === 1 ? "" : "s"}`;

// Week tile text: "WEEK 5", "PRE 2", a date for date-based leagues, or a short name ("BOWLS")
function weekTile(w) {
  const k = String(w.sort_key || "");
  if (/^\d{8}$/.test(k)) {
    const d = new Date(Date.UTC(+k.slice(0, 4), +k.slice(4, 6) - 1, +k.slice(6)));
    return { top: d.toLocaleDateString("en-US", { month: "short", timeZone: "UTC" }).toUpperCase(), big: String(d.getUTCDate()) };
  }
  const n = /(\d+)/.exec(w.label || "");
  if (n) return { top: /preseason/i.test(w.label) ? "PRE" : "WEEK", big: n[1] };
  const word = String(w.label || "").split(/\s+/)[0].slice(0, 6).toUpperCase();
  return { top: "", big: word, small: true };
}
const filled = b => (b.squares || []).filter(x => String(x || "").trim()).length;
function weekStatus(w) {
  const boards = w.board_sets.flatMap(x => x.boards);
  if (!boards.length) return { cls: "", text: "No boards" };
  if (boards.some(b => !b.locked)) return { cls: "open", text: "Open" };
  if (boards.every(b => b.final)) return { cls: "", text: "Final" };
  return { cls: "", text: "Locked" };
}

async function weekForm(title, ok, current, weeks) {
  setList("league-list", Object.keys(LEAGUES));
  const today = new Date(Date.now() - new Date().getTimezoneOffset() * 60000).toISOString().slice(0, 10);
  const curDate = current && String(current.sort_key).length === 8
    ? `${String(current.sort_key).slice(0, 4)}-${String(current.sort_key).slice(4, 6)}-${String(current.sort_key).slice(6)}` : today;
  const v = await modal({ title, ok,
    text: "Pick a league. Football leagues use weeks; other ESPN leagues use the game date. Any other league, type your own.",
    fields: [
      { name: "league", label: "League", list: "league-list", value: current?.league || "", placeholder: "NFL, NBA, MLB, or type one", required: true, maxlength: 40 },
      { name: "season", label: "Season", type: "number", inputmode: "numeric", value: current?.season ?? currentSeason(), min: 2000, max: 2100, half: true },
      { name: "label", label: "Week", list: "week-list", value: current && !String(current.sort_key).match(/^\d{8}$/) ? current.label : "", placeholder: "Pick a week", maxlength: 40, half: true },
      { name: "date", label: "Game date", type: "date", value: curDate }
    ],
    after: inputs => {
      const show = (el, on) => { el.closest("label").style.display = on ? "" : "none"; };
      const sync = () => {
        const L = leagueFor(inputs.league.value), byDate = L?.mode === "date";
        setList("week-list", L?.weeks || []);
        show(inputs.season, !byDate); show(inputs.label, !byDate); show(inputs.date, byDate);
      };
      inputs.league.addEventListener("input", sync); sync();
      // New football week: pre-fill the current week from ESPN (the next one once this week's games are done)
      if (!current) {
        let auto = "", ask = 0;
        const fill = async () => {
          const L = leagueFor(inputs.league.value), n = ++ask;
          if (L?.mode !== "week" || (inputs.label.value && inputs.label.value !== auto)) return;
          try {
            const { data } = await sb.functions.invoke("pull-scores", { body: { week_on: { league: L.name, season: Number(inputs.season.value) || currentSeason(), date: today } } });
            if (n !== ask || !data?.label || (inputs.label.value && inputs.label.value !== auto)) return;
            auto = inputs.label.value = data.label;
          } catch { /* leave it blank; they can pick from the list */ }
        };
        inputs.league.addEventListener("input", fill);
        inputs.league.addEventListener("change", fill);
        inputs.season.addEventListener("change", fill);
        fill();
      }
    } });
  if (!v) return null;
  const L = leagueFor(v.league);
  const league = L ? L.name : v.league.trim();
  if (!league) { toast("Enter a league.", true); return null; }
  if (L?.mode === "date") {
    if (!v.date) { toast("Pick the game date.", true); return null; }
    const d = dateParts(v.date);
    return { league, season: L.crossYear && d.m < 8 ? d.y - 1 : d.y, label: d.label, sort_key: d.key };
  }
  const season = Number(v.season) || currentSeason();
  let label = v.label.trim();
  if (!label) { toast("Enter the week.", true); return null; }
  // Preset weeks sort in season order; typed-in weeks go after the latest one
  const idx = L ? L.weeks.findIndex(x => x.toLowerCase() === label.toLowerCase()) : -1;
  if (L?.mode === "week" && idx < 0) { toast(`Pick a week from the ${L.name} list, like "${L.weeks[L.weeks.length > 5 ? 5 : 0]}".`, true); return null; }
  if (idx >= 0) label = L.weeks[idx];
  if (await weekMissing({ league, season, label })) { toast(`ESPN has no ${label} in the ${league} ${seasonLabel(league, season)} season.`, true); return null; }
  const same = (weeks || []).filter(w => w.league === league && w.season === season && w.id !== current?.id);
  return { league, season, label, sort_key: idx >= 0 ? idx + 1 : Math.max(0, ...same.map(w => w.sort_key)) + 1 };
}

// Default board set name: day of the week and the date, no year ("Saturday Oct 3rd")
const ordinal = n => n + ((n % 100 >= 11 && n % 100 <= 13) ? "th" : ["th", "st", "nd", "rd"][n % 10] || "th");
function gameDayName(iso) {
  const [y, m, d] = String(iso).split("-").map(Number);
  if (!y || !m || !d) return "";
  const dt = new Date(Date.UTC(y, m - 1, d));
  return `${dt.toLocaleDateString("en-US", { weekday: "long", timeZone: "UTC" })} ${dt.toLocaleDateString("en-US", { month: "short", timeZone: "UTC" })} ${ordinal(d)}`;
}
// Starting date: a date-based week's own date; football weeks use that week's Saturday (college)
// or Sunday (NFL) from ESPN's calendar. Without ESPN dates, the next Saturday/Sunday from today.
async function defaultGameDay(w) {
  const k = String(w.sort_key || "");
  if (/^\d{8}$/.test(k)) return isoOf(k);
  const want = w.league === "NFL" ? 0 : w.league === "College Football" ? 6 : null;
  const r = await weekRange(w);
  if (r) {
    if (want == null) return r.start;
    for (let d = r.start; d <= r.end; d = addDays(d, 1)) if (new Date(d + "T12:00:00Z").getUTCDay() === want) return d;
    return r.start;
  }
  const now = new Date(Date.now() - new Date().getTimezoneOffset() * 60000);
  if (want != null) now.setUTCDate(now.getUTCDate() + ((want - now.getUTCDay() + 7) % 7));
  return now.toISOString().slice(0, 10);
}

      ],
      after: inputs => {
        let auto = inputs.name.value === gameDayName(date) ? inputs.name.value : null;
        inputs.date.addEventListener("change", () => {

    h("p", { class: "sub" }, wk.league ? `${wk.label}, ${wk.league} ${seasonLabel(wk.league, wk.season)}` : ""),
    h("div", { class: "actions" },
      btn("Copy set link", () => copy(link("#/s/" + id))),
      mg && btn("Rename set", () => renameSet(set)),
      mg && btn("Move to week", () => moveSet(set)),
      mg && btn("Add board", () => addBoard(set, boards.length), "primary"),
      mg && boards.some(x => !x.locked) && btn("Lock open boards", () => lockAll(boards.filter(x => !x.locked).map(x => x.id)))),
    boards.length ? boards.map(b => boardBlock(b, mg, { ...set.weeks, community_id: set.community_id, siblings: boards.length })) : h("p", { class: "empty" }, mg ? "Add a board for each game in this set." : "No boards posted yet.")
  );
}

// Game-day items for the board's ☰ menu, so phones get the same set buttons as the game-day page
function setMenu(set, wk) {
  const open = (set.boards || []).filter(x => !x.locked).map(x => x.id);
  return ["-", { heading: set.name },
    { label: "Add board", fn: () => addBoard({ ...set, weeks: wk }, (set.boards || []).length) },
    open.length && { label: "Lock open boards", fn: () => lockAll(open) },
    { label: "Copy set link", fn: () => copy(link("#/s/" + set.id)) },
    { label: "Rename set", fn: () => renameSet({ ...set, weeks: wk }) },
    { label: "Move to week", fn: () => moveSet(set) }];
}
async function viewBoard(id) {
  const b = must(await sb.from("boards").select("*, board_sets(id,name,game_date,community_id,week_id,boards(id,locked))").eq("id", id).maybeSingle());
  if (!b) throw new Error("Board not found. Check the link.");
  const mg = canManage(b.board_sets.community_id);
  const wk = must(await sb.from("weeks").select("*").eq("id", b.board_sets.week_id).maybeSingle());
  await loadSquareStyles(b.board_sets.community_id);
  const owner = mg || (S.me && b.managed_by === S.me.id);
  render(
    h("div", { class: "crumbs" }, h("a", { href: "#/s/" + b.board_sets.id }, b.board_sets.name)),
    boardBlock(b, mg, { ...(wk || {}), community_id: b.board_sets.community_id, siblings: 1, dayMenu: mg ? setMenu(b.board_sets, wk) : [] }),
    owner ? await helpersPanel(b) : null
  );
}

/* ---------- Scores and winning squares ----------
   ESPN scores are pulled by the "pull-scores" function in Supabase, which asks ESPN
   directly and saves the result. Anyone viewing can trigger it, but nobody can fake it.
   Admins can still type scores by hand for any league. */
const ESPN_LEAGUES = ["NFL", "College Football", "NBA", "WNBA", "Men's College Basketball", "Women's College Basketball", "MLB", "NHL", "MLS"];
const SLOTS = [["q1", "Q1"], ["q2", "Q2"], ["q3", "Q3"], ["final", "Final"]];
// Men's college basketball plays two halves: only Half and Final pay. Half is stored in q2,
// which is where the pull-scores function puts the halftime score.
const HALF_SLOTS = [["q2", "Half"], ["final", "Final"]];
const isHalves = league => leagueFor(league)?.name === "Men's College Basketball";
const slotsFor = league => isHalves(league) ? HALF_SLOTS : SLOTS;
const slotTag = lbl => lbl === "Final" ? "F" : lbl === "Half" ? "H" : lbl;
function canPull(ctx) {
  const L = leagueFor(ctx?.league);
  return !!L && ESPN_LEAGUES.includes(L.name) && (L.mode === "date" || L.weeks.includes(ctx.label));
}
async function pullScores(b) {
  const { data, error } = await sb.functions.invoke("pull-scores", { body: { board_id: b.id } });
  if (error) throw new Error("Couldn't update the score right now. " + (error.message || ""));
  if (data?.error) throw new Error(data.error);
  return data;
}
// Winning square for each slot: last digit of each team's score, matched to the drawn numbers
function winners(b, slots = SLOTS) {
  const sc = b.scores || {}, map = new Map(), by = {};
  for (const [k, lbl] of slots) {
    const s = sc[k];
    if (!s) continue;
    const c = b.top_nums.indexOf(s.top % 10), r = b.side_nums.indexOf(s.side % 10);
    const idx = c >= 0 && r >= 0 ? r * 10 + c + 1 : null;
    by[k] = { ...s, idx };
    if (idx) map.set(idx, [...(map.get(idx) || []), slotTag(lbl)]);
  }
  return { map, by };
}

async function editScores(b, ctx, refresh) {
  const sc = b.scores || {}, T = b.top_team || "Top team", S = b.side_team || "Side team";
  const fields = [], slots = slotsFor(ctx?.league);
  for (const [k, lbl] of slots) fields.push(
    { name: k + "_top", label: `${lbl}: ${T}`, type: "number", inputmode: "numeric", min: 0, value: sc[k]?.top ?? "", half: true },
    { name: k + "_side", label: `${lbl}: ${S}`, type: "number", inputmode: "numeric", min: 0, value: sc[k]?.side ?? "", half: true });
  const espnOk = canPull(ctx);
  const v = await modal({ title: "Scores",
    text: espnOk ? "Pull the game from ESPN and it keeps updating on its own. Typing scores in turns ESPN off for this board until you pull again."
                 : `Type each team's total score at the end of each ${isHalves(ctx?.league) ? "half" : "quarter"}.`,
    fields, ok: "Save scores",
    extra: [...(espnOk ? [{ label: "Pull from ESPN", action: "pull", cls: "primary" }] : []),
            ...(Object.keys(sc).length ? [{ label: "Clear", action: "clear", cls: "danger" }] : [])] });
  if (!v) return;
  try {
    if (v.__action === "pull") {
      toast("Checking ESPN...");
      must(await sb.rpc("set_scores", { bid: b.id, sc: {}, ev: b.espn_event }));   // clears typed scores so ESPN takes over
      const row = await pullScores(b);
      refresh(row);
      const s2 = row.scores || {};
      return toast(s2.note ? s2.note : s2.state === "pre" ? "Game found. Scores fill in once it starts." : "Scores updated from ESPN", !!s2.note);
    }
    if (v.__action === "clear") return refresh(must(await sb.rpc("set_scores", { bid: b.id, sc: {}, ev: null })));
    const out = { state: "manual" };
    for (const [k] of SLOTS) {
      if (!slots.some(([x]) => x === k)) { out[k] = null; continue; }   // slot not used by this league
      const t = String(v[k + "_top"]).trim(), s = String(v[k + "_side"]).trim();
      out[k] = t !== "" && s !== "" ? { top: Math.max(0, Math.floor(Number(t)) || 0), side: Math.max(0, Math.floor(Number(s)) || 0) } : null;
    }
    refresh(must(await sb.rpc("set_scores", { bid: b.id, sc: out, ev: b.espn_event })));
  } catch (e) { toast(e.message, true); }
}

// Viewers' "Update score" button: same ESPN check, saved for everyone
async function viewerPull(b, refresh) {
  try {
    toast("Checking ESPN...");
    const row = await pullScores(b);
    refresh(row);
    toast(row.scores?.note || (row.scores?.state === "pre" ? "Game hasn't started yet" : "Score is up to date"), !!row.scores?.note);
  } catch (e) { toast(e.message, true); }
}

// One timer per page asks for every open board's score in a single request:
// every 15 seconds while a game is on (or about to start), every minute otherwise.
// A board drops off for good once its final score is in (or scores were typed by hand).
// The server decides whether ESPN actually needs checking (at most every 12 seconds per
// board, and not at all until 15 minutes before kickoff).
const FAST_MS = 15000, SLOW_MS = 60000;
const WATCH = new Map(), LAST_PULL = new Map();
let WATCH_TIMER = null, WATCH_MS = 0, POLL_SOON = null;
function stopWatching() { WATCH.clear(); clearInterval(WATCH_TIMER); WATCH_TIMER = null; WATCH_MS = 0; }
function watchLive(b, ctx, mg, refresh) {
  const sc = b.scores || {};
  if (!canPull(ctx) || sc.state === "manual" || sc.state === "post" || sc.final) { WATCH.delete(b.id); return scheduleWatch(); }
  WATCH.set(b.id, { b, refresh });
  scheduleWatch();
  if (Date.now() - (LAST_PULL.get(b.id) || 0) > 10000) { clearTimeout(POLL_SOON); POLL_SOON = setTimeout(pollWatched, 100); }  // check when the board opens
}
function scheduleWatch() {
  const fast = [...WATCH.values()].some(({ b }) => {
    const sc = b.scores || {}, start = Date.parse(kickoffOf(b) || "");
    return sc.state === "in" || (Number.isFinite(start) && start - Date.now() < 20 * 60000);
  });
  const ms = !WATCH.size ? 0 : fast ? FAST_MS : SLOW_MS;
  if (ms === WATCH_MS) return;
  clearInterval(WATCH_TIMER); WATCH_TIMER = ms ? setInterval(pollWatched, ms) : null; WATCH_MS = ms;
}
// Only what a viewer would actually see. The time of the last ESPN check changes
// on every check, so it's left out or the board would redraw for nothing.
const boardSig = b => {
  const sc = b.scores || {};
  return JSON.stringify([sc.q1, sc.q2, sc.q3, sc.final, sc.state, sc.detail, sc.top_now, sc.side_now, sc.note,
    b.locked, b.locked_at, b.locked_auto, b.unlocked_at, b.unlocked_by_name, b.numbers_auto_at, b.top_nums, b.side_nums]);
};
async function pollWatched() {
  const ids = [...WATCH.keys()];
  if (!ids.length) return;
  ids.forEach(id => LAST_PULL.set(id, Date.now()));
  try {
    const { data, error } = await sb.functions.invoke("pull-scores", { body: { board_ids: ids } });
    if (error || !data?.boards) return;
    for (const row of data.boards) {
      const w = WATCH.get(row.id);
      if (!w || row.error || boardSig(row) === boardSig(w.b)) continue;
      const justLocked = row.locked && !w.b.locked;
      w.refresh(row);
      if (justLocked) toast(row.numbers_auto_at ? "Board locked. Numbers are drawn." : "Board locked.");
    }
  } catch { /* try again next round */ }
}

/* ---------- Board block ---------- */
function boardBlock(b, mg, ctx) {
  const helper = !mg && S.helper?.has(b.id);          // helper on this one board
  const canEdit = mg || helper;
  const owner = mg || (S.me && b.managed_by === S.me.id);
  // Commissioners can change locked boards (names, numbers, details). The board stays locked.
  const commEdit = mg && b.locked && isComm();
  const editable = canEdit && (!b.locked || commEdit);
  const block = h("section", { class: "block", "data-board": b.id });
  const refresh = nb => {
    const { board_sets } = b;
    // The page may have been redrawn since this board was built; update whatever copy is on screen now
    const cur = block.isConnected ? block : document.querySelector(`section[data-board="${b.id}"]`);
    if (!cur) return;
    const nw = boardBlock({ ...nb, board_sets }, mg, ctx);
    cur.replaceWith(nw);
    requestAnimationFrame(fitBoards);
  };
  const sheet = renderSheet(b, editable, refresh, slotsFor(ctx?.league), ctx?.league);
  block.append(
    h("div", { class: "bar" },
      h("span", { class: "status " + (b.locked ? "locked" : "open") }, b.locked ? "Locked" : "Open"),

      b.scores?.state === "in" && h("span", { class: "status live" }, "Live"),

// League mark for the board's top-left corner: real logos for pro leagues, a text badge for college
const LEAGUE_LOGOS = { "NFL": "nfl", "NBA": "nba", "WNBA": "wnba", "MLB": "mlb", "NHL": "nhl", "MLS": "mls" };
const COLLEGE_BADGE = { "College Football": ["COLLEGE", "FOOTBALL"], "Men's College Basketball": ["COLLEGE", "BASKETBALL"],
  "Women's College Basketball": ["WOMEN'S", "COLLEGE HOOPS"] };
function leagueMark(league) {
  if (LEAGUE_LOGOS[league]) return h("img", { class: "lgmark", src: `https://a.espncdn.com/i/teamlogos/leagues/500/${LEAGUE_LOGOS[league]}.png`, alt: league, crossorigin: "anonymous" });
  const t = COLLEGE_BADGE[league];
  return t ? h("div", { class: "lgbadge" }, h("span", {}, t[0]), h("b", {}, t[1])) : null;
}
const teamLogo = url => url && h("img", { class: "tlogo", src: url, alt: "", crossorigin: "anonymous" });
// Find ESPN logos for a board's teams and save them (only exact school or team names match)
async function attachLogos(row, league, refresh) {
  if (!row || !ESPN_LEAGUES.includes(league)) return row;
  try {
    const { data } = await sb.functions.invoke("pull-scores", { body: { team_logos: { league, names: [row.top_team, row.side_team] } } });
    const top = data?.logos?.[row.top_team] || null, side = data?.logos?.[row.side_team] || null;
    if (top === (row.top_logo || null) && side === (row.side_logo || null)) return row;
    const saved = must(await sb.from("boards").update({ top_logo: top, side_logo: side }).eq("id", row.id).select());
    const out = saved[0] || { ...row, top_logo: top, side_logo: side };
    if (refresh) refresh(out);
    return out;
  } catch { return row; }   // logos are a nice-to-have; the board works without them
}

function renderSheet(b, editable, refresh, slots = SLOTS, league = "") {
  // Team name font picked on the board (Edit details); block letters when none is picked
  if (b.team_font) ensureFonts([b.team_font]);
  const teamFam = b.team_font && fontOf(b.team_font) ? `;font-family:'${fontOf(b.team_font)[2]}',var(--display)` : "";
  const teamFx = teamFam ? " fx" : "";
  const win = winners(b, slots), sc = b.scores || {};
  const clickable = fn => editable ? {
    role: "button", tabindex: "0", onclick: fn,
    onkeydown: e => { if (e.key === "Enter" || e.key === " ") { e.preventDefault(); fn(); } }
  } : {};
  // Dividers between colored number boxes: light lines on dark colors, dark lines on light colors.
  const divider = c => textOn(c) === "#FFFFFF" ? "#FFFFFF" : "var(--rule)";
  const numStyle = (c, axis, last) => `background:${c};color:${textOn(c)};` + (last ? "" :
    (axis === "top" ? `border-right:2px solid ${divider(c)}` : `border-bottom:2px solid ${divider(c)}`));
  const grid = h("div", { class: "grid" },
    h("div", { class: "corner" }, leagueMark(league)),
    h("div", { class: "tlabel" }, teamLogo(b.top_logo), h("span", { class: "team" + teamFx, style: "color:" + b.top_color + teamFam }, b.top_team)),
    h("div", { class: "slabel" }, h("div", {}, teamLogo(b.side_logo), h("span", { class: "team" + teamFx, style: "color:" + b.side_color + teamFam }, b.side_team)))
  );
  for (let i = 0; i < 10; i++) {
    grid.append(h("div", {
      class: "num" + (i === 9 ? " c10" : ""), style: `grid-row:2;grid-column:${i + 3};` + numStyle(b.top_color, "top", i === 9),
      "aria-label": `Top number ${i + 1}`, ...clickable(() => editNumber(b, "top", i + 1, refresh))
    }, b.top_nums[i] ?? ""));
    grid.append(h("div", {
      class: "num" + (i === 9 ? " r10" : ""), style: `grid-row:${i + 3};grid-column:2;` + numStyle(b.side_color, "side", i === 9),
      "aria-label": `Side number ${i + 1}`, ...clickable(() => editNumber(b, "side", i + 1, refresh))
    }, b.side_nums[i] ?? ""));
  }
  for (let r = 0; r < 10; r++) for (let c = 0; c < 10; c++) {
    const idx = r * 10 + c + 1;
    const wins = win.map.get(idx);
    grid.append(h("div", {
      class: "sq" + (c === 9 ? " c10" : "") + (r === 9 ? " r10" : "") + (wins ? " win" : ""),
      style: `grid-row:${r + 3};grid-column:${c + 3}`,
      "aria-label": `Square ${idx}${b.squares[idx - 1] ? ", " + b.squares[idx - 1] : ""}`,
      ...clickable(() => editSquare(b, idx, refresh))
    }, wins && h("span", { class: "wb" }, wins.join(" ")),
      (() => { const st = sqStyle(b.squares[idx - 1]); return st?.avatar && h("img", { class: "sqav", src: st.avatar, alt: "", crossorigin: "anonymous" }); })(),
      h("span", { class: "nm" + (sqStyle(b.squares[idx - 1])?.font && sqStyle(b.squares[idx - 1]).font !== "classic" ? " fx" : ""),
        style: sqStyle(b.squares[idx - 1])?.font ? `font-family:${fontStack(sqStyle(b.squares[idx - 1]).font)}` : null }, b.squares[idx - 1] || ""),
      h("span", { class: "no" }, idx)));
  }
  return h("div", { class: "sheet" + (editable ? " edit" : ""), "data-cap": b.id },
    (b.managed_by_name || b.numbers_auto_at || b.unlocked_at) && h("div", { class: "sheettop" },
      h("span", {}, b.managed_by_name ? `Managed by ${b.managed_by_name}` : ""),
      h("span", { class: "stamps" },
        b.numbers_auto_at ? h("span", {}, `Numbers drawn by auto-lock ${lockTime(b.numbers_auto_at)}`) : null,
        b.unlocked_at ? h("span", {}, `Unlocked by ${b.unlocked_by_name || "the Board Master"} ${lockTime(b.unlocked_at)}`) : null)),
    h("div", { class: "kick" }, b.kickoff),
    (sc.state === "pre" && kickoffOf(b))
      ? h("div", { class: "gstat" }, `Kickoff ${lockTime(kickoffOf(b))}`)
      : (sc.detail ? h("div", { class: "gstat" + (sc.state === "in" ? " on" : "") },
          `${sc.detail}: ${b.top_team} ${sc.top_now}, ${b.side_team} ${sc.side_now}`) : null),
    h("div", { class: "shead" }, h("div", { class: "title" }, `${b.sport ? b.sport + " " : ""}Squares`), h("div", { class: "price" }, `${Number(b.price || 0).toLocaleString("en-US", { maximumFractionDigits: 2 })} points per square`)),
    h("div", { class: "smain" }, grid,
      h("div", { class: "pay" }, slots.map(([k, lbl]) => {
        const w = win.by[k];
        if (!w) return h("div", {}, h("b", {}, lbl + ":"), h("span", {}, pts(b[k])));
        const name = w.idx ? (b.squares[w.idx - 1] || "") : "";
        // Winner's name is the headline of the box; amount and score sit under it
        return h("div", { class: "won" }, h("b", {}, lbl + ":"),
          h("div", { class: "who" + (name ? "" : " none") }, name || (w.idx ? `Square ${w.idx}` : "Draw numbers")),
          h("div", { class: "amt" }, pts(b[k])),
          h("div", { class: "sc" }, `${w.top}-${w.side}`));
      }))),
    b.footer && h("div", { class: "foot" }, b.footer)
  );
}

/* ---------- Board actions ---------- */
async function editSquare(b, idx, refresh) {
  const cur = b.squares[idx - 1] || "";
  const v = await modal({ title: `Square ${idx}`, fields: [{ name: "name", label: "Name", value: cur, maxlength: 40, placeholder: "Who owns this square" }],
    ok: "Save name", extra: cur ? [{ label: "Clear square", action: "clear", cls: "danger" }] : [] });
  if (!v) return;
  const val = v.__action === "clear" ? "" : v.name.trim();
  try {
    const row = must(await sb.rpc("set_square", { bid: b.id, idx, val }));
    refresh(row);
    // Last empty square just got a name: offer to lock early so the board can go out now
    if (val && !row.locked && isFull(row) && !isFull(b)) await offerEarlyLock(row, refresh);
  } catch (e) { toast(e.message, true); }
}

const isFull = b => (b.squares || []).filter(x => String(x || "").trim()).length === 100;
async function offerEarlyLock(b, refresh) {
  if (!await confirmBox("Board is full. Lock it now?",
    "Locking now draws the numbers so you can send the board out. If you wait, it still locks itself 15 minutes before kickoff.",
    "Lock and draw numbers", "primary")) return toast("Board left open");
  await earlyLock(b, refresh);
}
async function earlyLock(b, refresh) {
  try { refresh(must(await sb.rpc("lock_full_board", { bid: b.id }))); toast("Board locked and numbers drawn"); }
  catch (e) { toast(e.message, true); }
}

async function editNumber(b, axis, idx, refresh) {
  const arr = axis === "top" ? b.top_nums : b.side_nums;
  const team = (axis === "top" ? b.top_team : b.side_team) || (axis === "top" ? "Top" : "Side");
  const v = await modal({ title: `${team}: box ${idx}`, text: "Enter the drawn number, 0 to 9. Leave blank to clear.",
    fields: [{ name: "n", label: "Number", type: "number", inputmode: "numeric", min: 0, max: 9, step: 1, value: arr[idx - 1] ?? "" }], ok: "Save number" });
  if (!v) return;
  const raw = String(v.n).trim();
  const val = raw === "" ? null : Number(raw);
  if (val !== null && !(Number.isInteger(val) && val >= 0 && val <= 9)) return toast("Use a single number from 0 to 9.", true);
  try { refresh(must(await sb.rpc("set_number", { bid: b.id, axis, idx, val }))); }
  catch (e) { toast(e.message, true); }
}

function detailFields(b = {}, league) {
  const halves = isHalves(league);
  return [
    { name: "sport", label: "Sport", value: b.sport ?? "Football", list: "sport-list", maxlength: 30, placeholder: "Football, Basketball, or type one" },
    { name: "top_team", label: "Top team", value: b.top_team, half: true, maxlength: 40, list: "team-list", placeholder: "Start typing a team" },
    { name: "top_color", label: "Top team color", type: "color", value: b.top_color || "#F7941D", half: true },
    { name: "side_team", label: "Side team", value: b.side_team, half: true, maxlength: 40, list: "team-list", placeholder: "Start typing a team" },
    { name: "side_color", label: "Side team color", type: "color", value: b.side_color || "#FFE14D", half: true },
    { name: "team_font", label: "Team name font", value: b.team_font || "board",
      options: [{ value: "board", label: "Board (block letters)" }, ...SQ_FONTS.map(([k, label, fam]) => ({ value: k, label: `${label} (${fam})` }))] },
    { name: "kickoff", label: "Kickoff line", value: b.kickoff, placeholder: "2:30 kickoff", maxlength: 60 },
    { name: "price", label: "Points per square", type: "number", step: "1", min: 0, inputmode: "numeric", value: b.price ?? 6, half: true },
    ...(halves ? [] : [{ name: "q1", label: "Q1 points", type: "number", step: "1", min: 0, inputmode: "numeric", value: b.q1 ?? 125, half: true }]),
    { name: "q2", label: halves ? "Half points" : "Q2 points", type: "number", step: "1", min: 0, inputmode: "numeric", value: b.q2 ?? (halves ? 250 : 125), half: true },
    ...(halves ? [] : [{ name: "q3", label: "Q3 points", type: "number", step: "1", min: 0, inputmode: "numeric", value: b.q3 ?? 125, half: true }]),
    { name: "final", label: "Final points", type: "number", step: "1", min: 0, inputmode: "numeric", value: b.final ?? (halves ? 250 : 125), half: true },
    { name: "footer", label: "Bottom note", value: b.footer ?? "NO PAY, NO PLAY!", maxlength: 60, half: true }
  ];
}
function wireTeams(inputs) {
  wireTeamLookup(inputs, "top_team", "top_color");
  wireTeamLookup(inputs, "side_team", "side_color");
}
function cleanDetails(v, league) {
  const num = x => { const n = Number(x); return Number.isFinite(n) && n >= 0 ? n : 0; };
  if (isHalves(league)) { v.q1 = 0; v.q3 = 0; }   // halves only: no Q1 or Q3 payout
  return { sport: v.sport.trim(), top_team: v.top_team.trim(), top_color: v.top_color, side_team: v.side_team.trim(), side_color: v.side_color,
    kickoff: v.kickoff.trim(), price: num(v.price), q1: num(v.q1), q2: num(v.q2), q3: num(v.q3), final: num(v.final), footer: v.footer.trim(),
    team_font: v.team_font && v.team_font !== "board" && fontOf(v.team_font) ? v.team_font : null };
}

async function addBoard(set, count, pre = {}, onDone = null) {
  teamDatalist(); setList("sport-list", SPORTS);
  const sport = leagueFor(set.weeks?.league)?.sport ?? "";
  const v = await modal({ title: "Add board", fields: detailFields({ sport, ...pre }, set.weeks?.league), ok: "Add board", after: wireTeams });
  if (!v) return;
  try {
    let row = must(await sb.from("boards").insert({ set_id: set.id, sort_order: count, ...cleanDetails(v, set.weeks?.league) }).select().single());
    row = await attachLogos(row, set.weeks?.league);
    onDone ? await onDone(row) : route();
  } catch (e) { toast(e.message, true); }
}

async function editDetails(b, refresh, league) {
  teamDatalist(); setList("sport-list", SPORTS);
  const v = await modal({ title: "Edit details", fields: detailFields(b, league), ok: "Save details", after: wireTeams });
  if (!v) return;
  try {
    const rows = must(await sb.from("boards").update(cleanDetails(v, league)).eq("id", b.id).select());
    if (!rows.length) return toast("Board is locked or you don't have edit rights.", true);
    refresh(await attachLogos(rows[0], league));
  } catch (e) { toast(e.message, true); }
}

// Quick way to close out everything still open
async function lockAll(ids) {
  if (!ids.length) return toast("Nothing open to lock.");
  if (!await confirmBox("Lock open boards?", `${ids.length} board${ids.length === 1 ? "" : "s"} will be locked. Only the super admin can unlock.`, "Lock them", "primary")) return;
  let n = 0;
  for (const id of ids) {
    try { const rows = must(await sb.from("boards").update({ locked: true }).eq("id", id).select()); if (rows.length) n++; }
    catch (e) { toast(e.message, true); }
  }
  toast(`${n} board${n === 1 ? "" : "s"} locked`);
  route();
}

// Helpers can work on one board only: names, numbers, scores and locking
async function helpersPanel(b) {
  const wrap = h("section", { class: "block" });
  const list = h("ul", { class: "list" });
  const load = async () => {
    const rows = must(await sb.rpc("board_helpers", { bid: b.id })) || [];
    list.replaceChildren(...(rows.length ? rows.map(r => h("li", {},
      h("div", {}, h("b", {}, r.display_name), h("div", { class: "meta" }, r.email)),
      btn("Remove", async () => {
        try { must(await sb.rpc("board_remove_helper", { bid: b.id, uid: r.user_id })); await load(); toast("Helper removed"); }
        catch (e) { toast(e.message, true); }
      }, "danger")))
      : [h("p", { class: "empty" }, "No helpers yet.")]));
  };
  await load();
  wrap.append(
    h("h2", {}, "Helpers on this board"),
    h("p", { class: "sub" }, "Helpers fill in names, draw numbers, update scores and can lock this board. Nothing else, and no other board."),

        fields: [{ name: "email", label: "Their login email", type: "email", required: true }], ok: "Add helper" });

        if (msg !== "added") return toast(msg, true);

      } catch (e) { toast(e.message, true); }
    }, "primary")),
    list);
  return wrap;
}

// Board Master only: every change on this board as a spreadsheet (kept until a week after the game)
async function downloadAudit(b) {
  try {
    const rows = must(await sb.from("board_audit").select("at,actor_name,action,detail,board_label").eq("board_id", b.id).order("at").order("id"));
    if (!rows.length) return toast("No changes logged for this board.");
    const cell = v => { let t = String(v ?? ""); if (/^[=+\-@\t\r]/.test(t)) t = "'" + t;   // spreadsheet formula guard
      return `"${t.replace(/"/g, '""')}"`; };
    const csv = [["Time (Central)", "Who", "What", "Details", "Board"],
      ...rows.map(r => [lockTime(r.at), r.actor_name, r.action, r.detail, r.board_label])].map(r => r.map(cell).join(",")).join("\r\n");
    const a = h("a", { href: URL.createObjectURL(new Blob(["\ufeff" + csv], { type: "text/csv" })),
      download: `audit-${(boardName(b)).replace(/[^a-z0-9]+/gi, "-")}-${new Date().toISOString().slice(0, 10)}.csv` });
    document.body.append(a); a.click(); a.remove();
    toast(`Audit log downloaded (${rows.length} changes)`);
  } catch (e) { toast(e.message, true); }
}

async function lockBoard(b, refresh) {
  if (!await confirmBox("Lock this board?", "No one can change it after this. Only the Board Master can unlock it.", "Lock board", "primary")) return;
  try {
    const rows = must(await sb.from("boards").update({ locked: true }).eq("id", b.id).select());
    if (!rows.length) return toast("Couldn't lock. The board may already be locked.", true);
    refresh(rows[0]); toast("Board locked");
  } catch (e) { toast(e.message, true); }
}

async function unlockBoard(b, refresh) {
  const v = await modal({ title: "Unlock board", text: `Enter your password to unlock. The board will show that ${S.me?.is_owner ? "the Board Master" : "you"} unlocked it.`,
    fields: [{ name: "pw", label: "Password", type: "password", autocomplete: "current-password", required: true }], ok: "Unlock" });
  if (!v) return;
  const { error } = await sb.auth.signInWithPassword({ email: S.session.user.email, password: v.pw });
  if (error) return toast("Wrong password. Board is still locked.", true);
  try {
    const rows = must(await sb.from("boards").update({ locked: false }).eq("id", b.id).select());
    if (!rows.length) return toast("Couldn't unlock this board.", true);
    refresh(rows[0]); toast("Board unlocked");
  } catch (e) { toast(e.message, true); }
}

async function moveBoard(b, ctx) {
  const setId = b.set_id;
  const cid = ctx?.community_id || b.board_sets?.community_id;
  const sets = must(await sb.from("board_sets").select("id,name,weeks(label,league,season)").eq("community_id", cid));
  if (sets.length < 2) return toast("Make another board set first.", true);
  const v = await modal({ title: "Move board", text: `Move ${boardName(b)} to a different board set.`,
    fields: [{ name: "set", label: "Board set", value: setId,
      options: sets.map(x => ({ value: x.id, label: `${x.name} — ${x.weeks?.label || ""}` })) }], ok: "Move board" });
  if (!v || v.set === setId) return;
  try {
    const rows = must(await sb.from("boards").update({ set_id: v.set }).eq("id", b.id).select());
    if (!rows.length) return toast("Board is locked or you don't have edit rights.", true);
    location.hash.startsWith("#/b/") ? go("#/s/" + v.set) : route();
  } catch (e) { toast(e.message, true); }
}

async function reorderBoard(b, dir, ctx) {
  try {
    const list = must(await sb.from("boards").select("id,sort_order,created_at").eq("set_id", b.set_id))
      .sort((x, y) => x.sort_order - y.sort_order || String(x.created_at).localeCompare(String(y.created_at)));
    const i = list.findIndex(x => x.id === b.id), j = i + dir;
    if (i < 0 || j < 0 || j >= list.length) return;
    // Renumber the whole set so ties can't leave two boards stuck together
    const order = list.map(x => x.id);
    order.splice(j, 0, ...order.splice(i, 1));
    for (let k = 0; k < order.length; k++) must(await sb.from("boards").update({ sort_order: k }).eq("id", order[k]));
    route();
  } catch (e) { toast(e.message, true); }
}

async function deleteBoard(b) {
  if (!await confirmBox("Delete board?", `${boardName(b)} and every name on it will be deleted.`, "Delete board")) return;
  try {
    const rows = must(await sb.from("boards").delete().eq("id", b.id).select());
    if (!rows.length) return toast("Board is locked or you don't have edit rights.", true);
    if (location.hash.startsWith("#/b/")) go("#/s/" + b.set_id); else route();
  } catch (e) { toast(e.message, true); }
}

// Renders the board to a PNG. mode "download" saves the file, "share" opens the share sheet.
async function boardImage(sheet, b) {
  await document.fonts?.ready;
  const canvas = await html2canvas(sheet, {
    scale: 2, backgroundColor: "#ffffff", useCORS: true,
    windowWidth: SHEET_W + 40,
    onclone: doc => {
      const el = doc.querySelector(`[data-cap="${b.id}"]`);
      if (!el) return;

/* ---------- Bracket pools (College Football Playoff, NFL Playoffs) ----------
   Teams from ESPN. Players pick every game; 10/20/40/80 points by round.
   Each game gets a squares board, and winners move up on their own.
   NFL: 14 teams, #1 seeds get byes, and the NFL reseeds after the Wild Card round
   (the #1 seed plays the lowest seed left). Seeds are stored AFC 1-7 and NFC 11-17. */
const ROUND_NAMES = ["First Round", "Quarterfinals", "Semifinals", "National Championship"];
const POOL_ROUNDS = { cfp: ROUND_NAMES, nfl: ["Wild Card", "Divisional Round", "Conference Championships", "Super Bowl"] };
const NEXT_KEY = "gts-next";
function nextHash() { try { return S.next || sessionStorage.getItem(NEXT_KEY) || ""; } catch { return S.next || ""; } }
function setNext(hash) { S.next = hash; try { hash ? sessionStorage.setItem(NEXT_KEY, hash) : sessionStorage.removeItem(NEXT_KEY); } catch {} }
function afterLogin() { const n = nextHash(); setNext(""); return n || "#/"; }

// Lines from each game to the game its winner plays next
const FEEDS = { 1: 5, 2: 6, 3: 7, 4: 8, 5: 9, 6: 9, 7: 10, 8: 10, 9: 11, 10: 11 };
// NFL: no lines out of the Wild Card round, since the Divisional matchups are reseeded
const NFL_FEEDS = { 4: 6, 5: 6, 10: 12, 11: 12, 6: 13, 12: 13 };
function bracketLines(br) {
  if (!br?.isConnected) return;
  br.querySelector(".blines")?.remove();
  const box = br.getBoundingClientRect(), pos = {};
  br.querySelectorAll(".game[data-slot]").forEach(el => {
    const r = el.getBoundingClientRect();
    pos[el.dataset.slot] = { l: r.left - box.left, r: r.right - box.left, m: r.top - box.top + r.height / 2 };
  });
  const paths = Object.entries(br.dataset.kind === "nfl" ? NFL_FEEDS : FEEDS).map(([from, to]) => {
    const a = pos[from], b = pos[to];
    if (!a || !b) return "";
    const x = (a.r + b.l) / 2;
    return `M${a.r} ${a.m}H${x}V${b.m}H${b.l}`;
  }).join("");
  const svg = document.createElementNS("http://www.w3.org/2000/svg", "svg");
  svg.setAttribute("class", "blines");
  svg.setAttribute("width", br.scrollWidth); svg.setAttribute("height", br.scrollHeight);
  svg.innerHTML = `<path d="${paths}" fill="none" style="stroke:var(--bline)" stroke-width="2"/>`;
  br.prepend(svg);
}
addEventListener("resize", () => document.querySelectorAll(".bracket").forEach(bracketLines));
document.fonts?.ready.then(() => document.querySelectorAll(".bracket").forEach(bracketLines));

const voteOpen = p => !p.closed && (!p.closes_at || Date.parse(p.closes_at) > Date.now());
const etDate = iso => new Date(iso).toLocaleDateString("en-CA", { timeZone: "America/New_York" });

  const time = tbaTime(g.kickoff) ? "time TBA" : d.toLocaleTimeString("en-US", { hour: "numeric", minute: "2-digit", timeZone: TZ, timeZoneName: "short" });
  return [day, time, g.tv].filter(Boolean).join(" · ");
}
